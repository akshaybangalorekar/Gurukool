<style>
  body { padding-bottom: env(safe-area-inset-bottom); }
  .s-wrap { max-width: 760px; margin: 0 auto; padding: 26px 22px 70px; }
  .s-h1 { font-family: Baloo 2, Nunito, sans-serif; font-weight: 800; font-size: 32px; color: #0f172a; margin: 4px 0 6px; }
  .s-lead { color: #64748b; font-size: 17px; line-height: 1.6; margin: 0 0 18px; }
  .s-panel { background: #fff; border: 1px solid #e6ebf1; border-radius: 20px; padding: 20px; }
  .s-row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid #f1f5f9; }
  .s-row:last-child { border-bottom: none; }
  .s-row .dot { width: 26px; height: 26px; border-radius: 50%; background: #f1f5f9; color: #94a3b8; font: 800 14px Nunito, system-ui, sans-serif; display: flex; align-items: center; justify-content: center; flex: 0 0 26px; }
  .s-row.now .dot { background: #b45309; color: #fff; }
  .s-row.done .dot { background: #34d399; color: #fff; }
  .s-row b { font: 800 17px Nunito, system-ui, sans-serif; color: #0f172a; display: block; }
  .s-row span { color: #64748b; font-size: 15px; }
  .s-row .mins { margin-left: auto; color: #94a3b8; font-weight: 700; font-size: 14.5px; white-space: nowrap; }
  .s-btn { font: 800 17px Nunito, system-ui, sans-serif; padding: 14px 20px; border-radius: 14px; border: 2px solid #cbd5e1; background: #fff; color: #334155; cursor: pointer; margin: 6px 8px 0 0; }
  .s-btn.p { background: #b45309; border-color: #b45309; color: #fff; }
  .s-bar { height: 8px; border-radius: 999px; background: #e2e8f0; overflow: hidden; margin: 4px 0 16px; }
  .s-bar div { height: 100%; background: #b45309; width: 0; transition: width .3s; }
  .s-clock { color: #64748b; font-weight: 800; font-size: 15px; }
  .s-q { font: 800 22px/1.5 Nunito, system-ui, sans-serif; color: #0f172a; margin: 8px 0 14px; }
  .s-dev { font-size: 26px; line-height: 1.5; color: #0f172a; margin: 0 0 10px; }
  .s-scene { background: #fffbeb; border: 1px solid #fcd34d; border-radius: 12px; padding: 12px 15px; margin: 0 0 12px; color: #78350f; font-size: 17px; line-height: 1.6; }
  .s-opt { display: block; width: 100%; text-align: left; font: 700 17.5px Nunito, system-ui, sans-serif; padding: 14px 16px; border: 2px solid #cbd5e1; background: #fff; color: #1e293b; border-radius: 14px; margin: 0 0 10px; cursor: pointer; }
  .s-opt .sub { display: block; font-weight: 600; font-size: 15px; color: #64748b; margin-top: 3px; }
  .s-opt.ok { border-color: #34d399; background: #ecfdf5; color: #065f46; }
  .s-opt.no { border-color: #fca5a5; background: #fef2f2; color: #991b1b; }
  .s-fb { font: 700 17px Nunito, system-ui, sans-serif; margin: 12px 0 0; min-height: 24px; }
  .s-fb.ok { color: #047857; } .s-fb.no { color: #b45309; }
  .s-know { background: #fffbeb; border: 1px solid #fcd34d; border-radius: 12px; padding: 12px 16px; margin: 12px 0; }
  .s-know li { font-size: 17px; line-height: 1.6; }
  .s-sol { background: #f5f3ff; border: 1px solid #c4b5fd; border-radius: 12px; padding: 14px 16px; margin-top: 12px; font-size: 17px; line-height: 1.7; }
  .s-note { background: #f0fdf4; border: 1px solid #86efac; border-radius: 12px; padding: 12px 14px; color: #166534; font-weight: 700; font-size: 15.5px; margin-top: 16px; }
  .s-say { font: 800 20px Nunito, system-ui, sans-serif; border: 2px solid #b45309; background: #fff; color: #b45309; border-radius: 12px; padding: 8px 14px; cursor: pointer; }
  .s-mline { padding: 10px 0; border-top: 1px solid #f1f5f9; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .s-mline .who { font: 800 13px Nunito, system-ui, sans-serif; color: #fff; background: #b45309; border-radius: 999px; padding: 3px 10px; }
  .s-abhy { background: linear-gradient(135deg,#b45309,#92400e); border-radius: 18px; padding: 16px 18px; color: #fff; margin: 0 0 18px; font-weight: 800; font-size: 17px; line-height: 1.5; }
  .s-abhy b { display: block; font-size: 20px; margin-bottom: 3px; }

<body>
  <header class="topnav" id="topnav"></header>
  <main class="s-wrap"><div id="s-view"></div></main>
  <script src="../version.js?v=46"></script>
  <script src="../gk-fresh.js?v=46"></script>
  <script src="../rhythm.js?v=46"></script>
  <script src="assets/content.js?v=46"></script>

  <script src="assets/nav.js?v=46"></script>
  <script>
  (function () {
    function el(id) { return document.getElementById(id); }
    function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }

    /* ---------- speaking, with the same fail-safe as the champ ----------
       If a device lists a Hindi voice that is not really installed, iOS
       drops the Devanagari and reads only the punctuation. So: never say a
       line with no letters, and if the Devanagari reading finishes far too
       fast, say the Latin line so the child still hears the word. */
    function hasLetters(t) { return /[A-Za-z\u0900-\u097F]/.test(String(t || '')); }
    function devCount(t) { var m = String(t || '').match(/[\u0900-\u097F]/g); return m ? m.length : 0; }
    function sayDev(t) { return String(t || '').replace(/\u0903/g, '\u0939').replace(/\u0902/g, '\u092E\u094D'); }
    function sayLatin(t) { return String(t || '').replace(/\u1E25/g, 'ha').replace(/\u1E43/g, 'm'); }
    function voices() { try { return (window.speechSynthesis && window.speechSynthesis.getVoices()) || []; } catch (e) { return []; } }
    function voiceFor(pfx) { var l = voices(); for (var i = 0; i < pfx.length; i++) for (var j = 0; j < l.length; j++) if (String(l[j].lang || '').toLowerCase().replace('_', '-').indexOf(pfx[i]) === 0) return l[j]; return null; }
    function speakLatin(text) {
      var synth = window.speechSynthesis, U = window.SpeechSynthesisUtterance;
      if (!synth || !U) return;
      var v = voiceFor(['en-in', 'en-gb', 'en']) || voices()[0] || null;
      var u = new U(); u.text = text;
      if (v) { u.voice = v; u.lang = v.lang || 'en-IN'; } else u.lang = 'en-IN';
      u.rate = 0.82; u.pitch = 1.5;
      try { synth.speak(u); } catch (e) {}
    }
    window.skSpeak = function (dev, latin) {
      var synth = window.speechSynthesis, U = window.SpeechSynthesisUtterance;
      if (!synth || !U) return;
      var hindi = voiceFor(['hi', 'sa']);
      var devSay = sayDev(dev), latSay = sayLatin(latin || dev);
      var text = hindi ? devSay : latSay;
      if (!hasLetters(text)) { text = latSay; }
      if (!hasLetters(text)) return;                    /* never read punctuation alone */
      var u = new U();
      u.text = text;
      if (hindi) { u.voice = hindi; u.lang = hindi.lang || 'hi-IN'; }
      else { var v = voiceFor(['en-in', 'en-gb', 'en']) || voices()[0] || null; if (v) { u.voice = v; u.lang = v.lang || 'en-IN'; } else u.lang = 'en-IN'; }
      u.rate = 0.82; u.pitch = 1.5;
      var t0 = Date.now(), ended = false;
      u.onend = function () {
        if (ended) return; ended = true;
        if (devCount(text) >= 2 && (Date.now() - t0) < (90 + 45 * devCount(text))) speakLatin(latSay);
      };
      try { if (synth.speaking || synth.pending) synth.cancel(); } catch (e) {}
      try { synth.speak(u); } catch (e) { speakLatin(latSay); }
    };
    function sayBtn(dev, latin) {
      return ' <button class="s-say" onclick="skSpeak(\'' + esc(dev) + '\',\'' + esc(latin || '') + '\')" title="Hear it">\uD83D\uDD0A</button>';
    }

    SkSession.ready();
    var rec = SkSession.today();
    var plan = rec.plan;
    var si = Math.min(rec.progress || 0, Math.max(0, plan.stages.length - 1));
    var qi = 0, tries = 0, stageRight = 0, answered = false;

    function stageRows() {
      return plan.stages.map(function (st, i) {
        var cls = i < si ? 'done' : (i === si ? 'now' : '');
        return '<div class="s-row ' + cls + '"><span class="dot">' + (i < si ? '✓' : (i + 1)) + '</span>' +
          '<span><b>' + esc(st.title) + '</b><span>' + esc(st.blurb || '') + '</span></span>' +
          '<span class="mins">' + st.mins + ' min</span></div>';
      }).join('');
    }
    function pct() { return Math.round(100 * si / plan.stages.length); }
    function head() {
      var st = plan.stages[si];
      return '<div class="s-bar"><div style="width:' + pct() + '%"></div></div>' +
        '<div class="s-clock">Part ' + (si + 1) + ' of ' + plan.stages.length + ' · ' + esc(st.title) + ' · ' + st.mins + ' min</div>';
    }

    function ready() {
      var last = SkSession.lastResult();
      el('s-view').innerHTML = '<h1 class="s-h1">🪔 Today\'s abhyāsa</h1>' +
        '<p class="s-lead">' + esc(plan.reason) + ' About ' + plan.mins + ' minutes, in five short parts. You do not have to decide anything — just press start.</p>' +
        '<div class="s-panel">' + stageRows() + '</div>' +
        '<button class="s-btn p" onclick="Sess.start()">▶ Start today\'s abhyāsa</button>' +
        (last ? '<p class="s-lead" style="margin-top:14px">Last time: ' + last.right + ' of ' + last.total + ' right.</p>' : '') +
        '<div class="s-note">🔒 Tomorrow\'s abhyāsa is prepared for you as soon as you finish this one.</div>';
    }

    function renderStage() {
      var st = plan.stages[si];
      if (!st) return finish();

      if (st.type === 'learn') {
        el('s-view').innerHTML = head() + '<div class="s-panel" style="margin-top:14px">' +
          '<p class="s-q">' + esc(st.title) + '</p>' +
          '<p class="s-lead">Open the conversation, talk with the guru, then come back here and carry on. Your place is saved.</p>' +
          '<a class="s-btn p" style="text-decoration:none" href="index.html#' + esc(st.scene) + '">Open the conversation</a>' +
          '<button class="s-btn" onclick="Sess.nextStage()">I have done it — carry on →</button></div>';
        return;
      }

      if (st.type === 'mission') {
        var m = st.mission;
        var h = head() + '<div class="s-panel" style="margin-top:14px"><p class="s-q">Say it to family</p>';
        if (m) {
          h += '<p class="s-lead">' + esc(m.title || '') + '</p>';
          h += (m.lines || []).map(function (l) {
            return '<div class="s-mline"><span class="who">' + esc(l.who || '') + '</span>' +
              '<span class="s-dev">' + esc(l.dev || '') + '</span>' +
              '<span class="s-lead" style="margin:0">' + esc(l.tr || '') + ' — ' + esc(l.mean || '') + '</span>' +
              sayBtn(l.dev, l.tr) + '</div>';
          }).join('');
        } else {
          h += '<p class="s-lead">This conversation has no mission yet. You have done well to get here.</p>';
        }
        h += '<button class="s-btn p" style="margin-top:14px" onclick="Sess.nextStage()">Finish the abhyāsa →</button></div>';
        el('s-view').innerHTML = h;
        return;
      }

      var q = st.qs[qi];
      if (!q) return finish();
      answered = false;
      var hh = head() + '<div class="s-panel" style="margin-top:14px">' +
        '<div class="s-clock">Question ' + (qi + 1) + ' of ' + st.qs.length + '</div>';
      if (q.scene) hh += '<div class="s-scene">' + esc(q.scene) + (q.say ? sayBtn(q.say.dev, q.say.tr) : '') + '</div>';
      hh += '<p class="s-q">' + esc(q.q) + '</p>' +
        (q.say ? '' : '') +
        (q.opts || []).map(function (o, i) {
          return '<button class="s-opt" id="s-opt-' + i + '" onclick="Sess.pick(' + i + ')">' + esc(o.label) +
            (o.sub ? '<span class="sub">' + esc(o.sub) + '</span>' : '') + '</button>';
        }).join('') +
        '<button class="s-btn" id="s-know-btn" onclick="Sess.know()">What do we know?</button>' +
        '<p class="s-fb" id="s-fb"></p><div id="s-know"></div><div id="s-sol"></div></div>';
      el('s-view').innerHTML = hh;
    }

    function finish() {
      var stats = SkSession.finish();
      el('s-view').innerHTML = '<h1 class="s-h1">Abhyāsa complete ✅</h1>' +
        '<div class="s-panel"><p class="s-q">' + stats.right + ' of ' + stats.total + ' right</p>' +
        '<p class="s-lead">That is a real abhyāsa — the kind that builds a champion. Stopping here is a smart move, not a small one.</p>' +
        '<div class="s-note">🔒 Tomorrow\'s abhyāsa is already prepared, built from what you did today.</div>' +
        '<div style="margin-top:16px"><a class="s-btn p" style="text-decoration:none" href="index.html">Back home</a>' +
        '<a class="s-btn" style="text-decoration:none" href="index.html#mission">Family missions</a></div></div>';
      if (window.SanskritNav && SanskritNav.top) SanskritNav.top();
    }

    window.Sess = {
      start: function () { si = 0; qi = 0; stageRight = 0; renderStage(); },
      nextStage: function () {
        var st = plan.stages[si];
        SkSession.markDone(si, stageRight, (st.qs || []).length);
        si++; qi = 0; stageRight = 0; tries = 0;
        SkSession.progress(si);
        if (si >= plan.stages.length) finish(); else renderStage();
      },
      know: function () {
        var q = plan.stages[si].qs[qi];
        el('s-know').innerHTML = '<div class="s-know"><b>What we know:</b><ul>' + (q.hints || []).map(function (k) { return '<li>' + esc(k) + '</li>'; }).join('') + '</ul></div>';
        el('s-know-btn').disabled = true;
      },
      pick: function (i) {
        if (answered) return;
        var st = plan.stages[si], q = st.qs[qi], fb = el('s-fb'), btn = el('s-opt-' + i);
        /* a conversation can have more than one acceptable answer, so trust the
           content's own marking rather than a single index */
        var right = !!(q.opts && q.opts[i] && q.opts[i].ok) || i === q.a;
        if (right) {
          answered = true;
          btn.className = 's-opt ok';
          var xp = tries === 0 ? 12 : 6;
          SkSession.award(xp); SkSession.record(q, true); stageRight++;
          if (window.Rhythm) Rhythm.note(true);
          fb.className = 's-fb ok'; fb.innerHTML = 'Correct — that is the technique. +' + xp + ' XP';
          qi++; tries = 0;
          if (qi >= st.qs.length) { fb.innerHTML += ' <b>That part is done.</b>'; el('s-sol').innerHTML = '<button class="s-btn p" onclick="Sess.nextStage()">Carry on →</button>'; }
          else el('s-sol').innerHTML = '<button class="s-btn p" onclick="Sess.nextQuestion()">Next question →</button>';
          return;
        }
        tries++;
        SkSession.record(q, false);
        if (window.Rhythm) Rhythm.note(false);
        btn.className = 's-opt no'; btn.disabled = true;
        fb.className = 's-fb no';
        if (tries === 1) fb.textContent = 'Not quite. ' + ((q.hints || [])[0] || 'Read it again slowly.');
        else {
          fb.textContent = 'Let us look at it — then carry on.';
          (q.opts || []).forEach(function (o, k) { if (o.ok || k === q.a) { var b = el('s-opt-' + k); if (b) b.className = 's-opt ok'; } });
          el('s-sol').innerHTML = '<div class="s-sol"><b>How it works</b><p style="margin:8px 0 0">' + esc(q.sol || '') + '</p>' +
            '<button class="s-btn p" style="margin-top:12px" onclick="Sess.nextQuestion()">Carry on</button></div>';
          answered = true; qi++;
        }
      },
      nextQuestion: function () {
        var st = plan.stages[si];
        if (qi >= st.qs.length) Sess.nextStage(); else renderStage();
      }
    };
    ready();
  })();
  </script>
  <script src="../kidpad.js?v=61"></script>
