<style>
  .inv-wrap { max-width: 780px; margin: 0 auto; padding: 16px 14px 120px; }
  .inv-lead { color: #7a6f60; line-height: 1.5; margin: 0 0 18px; text-align: center; }
  .inv-note { color: #7a6f60; font-size: 15px; line-height: 1.5; background: #f3ead7; border-radius: 12px; padding: 12px 14px; margin-top: 16px; }
  .inv-grid { display: grid; gap: 12px; }
  .inv-card { display: flex; gap: 14px; align-items: center; background: #fffdf7; border: 1.5px solid rgba(43,38,32,.14); border-radius: 16px; padding: 14px; cursor: pointer; transition: all .15s; }
  .inv-card:hover { transform: translateY(-2px); border-color: #66bb6a; box-shadow: 0 6px 16px rgba(46,125,50,.12); }
  .inv-card.done { border-color: #9ccc65; background: linear-gradient(135deg, #f1f8e9, #fffdf7 65%); }
  .inv-icon { font-size: 2rem; width: 54px; height: 54px; display: flex; align-items: center; justify-content: center; background: #f3ead7; border-radius: 14px; flex: none; }
  .inv-body { flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .inv-body b { font-size: 1.06rem; }
  .inv-subj { color: #2e7d32; font-weight: 800; font-size: 14.5px; }
  .inv-st { color: #7a6f60; font-size: 14.5px; font-weight: 700; }
  .inv-go { font-size: 1.5rem; color: #2e7d32; font-weight: 900; }
  .inv-scene { background: #fffdf7; border: 1.5px solid rgba(43,38,32,.14); border-radius: 18px; padding: 18px; box-shadow: 0 3px 14px rgba(43,38,32,.06); }
  .inv-dotrow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .inv-dot { width: 12px; height: 12px; border-radius: 50%; background: #f3ead7; border: 2px solid rgba(43,38,32,.14); }
  .inv-dot.done { background: #c8e6c9; border-color: #66bb6a; }
  .inv-dot.cur { background: #2e7d32; border-color: #2e7d32; }
  .inv-name { font-weight: 800; color: #7a6f60; margin-left: auto; }
  .inv-mystery { background: #e3f2fd; border-radius: 12px; padding: 12px 14px; line-height: 1.5; }
  .inv-q { font-weight: 800; font-size: 1.06rem; line-height: 1.5; margin: 14px 0 10px; }
  .inv-small { color: #7a6f60; font-size: 15px; }
  .inv-opts { display: grid; gap: 10px; margin: 8px 0; }
  .inv-opt { text-align: left; background: #fbf4e4; border: 2px solid rgba(43,38,32,.25); border-radius: 14px; padding: 12px 14px; cursor: pointer; font-family: inherit; font-size: 16.5px; color: #2b2620; }
  .inv-opt:hover { border-color: #2e7d32; background: rgba(46,125,50,.10); }
  .inv-opt.sel { border-color: #2e7d32; background: rgba(46,125,50,.10); }
  .inv-opt.used { opacity: .35; cursor: default; }
  .inv-clueq { font-weight: 800; margin: 14px 0 2px; color: #1b5e20; }
  .inv-slots { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
  .inv-slot { min-width: 60px; min-height: 46px; border: 2px dashed rgba(43,38,32,.25); border-radius: 12px; display: flex; align-items: center; justify-content: center; padding: 6px 10px; font-weight: 800; color: #7a6f60; background: #f3ead7; text-align: center; font-size: 14.5px; }
  .inv-slot.full { border-style: solid; border-color: #2e7d32; background: rgba(46,125,50,.10); color: #2b2620; }
  .inv-ansrow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .inv-in { font-family: inherit; font-size: 1.5rem; font-weight: 800; padding: 10px 14px; border-radius: 12px; border: 2px solid rgba(43,38,32,.25); width: min(300px, 100%); background: #fff; }
  .inv-pad { border: 2px solid rgba(43,38,32,.25); border-radius: 14px; background:
    repeating-linear-gradient(0deg, transparent 0 23px, rgba(43,38,32,.08) 23px 24px),
    repeating-linear-gradient(90deg, transparent 0 23px, rgba(43,38,32,.08) 23px 24px), #fff; max-width: 100%; touch-action: none; cursor: crosshair; }
  .inv-padwrap { text-align: center; margin: 10px 0; }
  .inv-btn { font-family: inherit; font-size: 1.1rem; font-weight: 800; padding: 12px 22px; border-radius: 14px; border: none; background: linear-gradient(135deg, #66bb6a, #2e7d32); color: #fff; cursor: pointer; box-shadow: 0 3px 0 #1b5e20; }
  .inv-btn:active { transform: translateY(2px); box-shadow: none; }
  .inv-btn.sec { background: #fbf4e4; color: #2b2620; border: 2px solid rgba(43,38,32,.25); box-shadow: none; }
  .inv-btn.tiny { font-size: .92rem; padding: 8px 14px; }
  .inv-actions { margin-top: 10px; }
  .inv-fb { border-radius: 12px; padding: 10px 14px; font-weight: 700; margin-top: 12px; }
  .inv-fb.info { background: #f3ead7; }
  .inv-fb.bad { background: #ffe0b2; color: #8a4b00; }
  .inv-fb.win { background: #c8e6c9; color: #047857; }
  .inv-note-inline { background: #f1f8e9; border-left: 5px solid #66bb6a; border-radius: 10px; padding: 12px 14px; margin-top: 12px; line-height: 1.5; }
</style>

<!-- ============ Kid Keypad + mic (touch devices) ============ -->
<style>
  #kidpad { position: fixed; left: 0; right: 0; bottom: 0; z-index: 900; display: none;
    margin: 0 auto; padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
    background: rgba(43, 38, 32, 0.97); border-radius: 18px 18px 0 0;
    box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.3); }
  #kidpad.show { display: block; }
  #kidpad .kstatus { color: #faf5ea; font-size: 13px; text-align: center; min-height: 16px; margin: 0 0 4px; }
  #kidpad .kgrid { display: flex; flex-wrap: wrap; gap: 7px; }
  #kidpad button { flex: 1 1 54px; min-width: 48px; min-height: 52px; font-size: 25px; font-weight: 800; border: 0; border-radius: 12px;
    background: #faf5ea; color: #2b2620; font-family: inherit; cursor: pointer;
    touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  #kidpad button:active { transform: translateY(2px); background: #f2d8a7; }
  #kidpad .kw { background: #e9e2d4; }
  #kidpad .kgo { background: #2a9d8f; color: #fff; font-size: 20px; letter-spacing: 0.4px; flex: 1.8 1 120px; }
  #kidpad .kmic { background: #e9e2d4; }
  #kidpad .kmic.listening { background: #ef5350; color: #fff; animation: kpulse 1s infinite; }
  @keyframes kpulse { 50% { opacity: 0.55; } }
</style>
<div id="kidpad" aria-hidden="true">
  <div class="kstatus" id="kpstatus"></div>
  <div class="kgrid">
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button data-k="4">4</button><button data-k="5">5</button>
    <button data-k="6">6</button><button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button data-k="0">0</button>
    <button data-k="." class="kw">.</button><button data-k="-" class="kw">&minus;</button><button data-k="+" class="kw">+</button><button data-k="back" class="kw" aria-label="Backspace">⌫</button>
    <button data-k="mic" class="kmic" aria-label="Speak your answer">🎤</button><button data-k="go" class="kgo">Check ✓</button>
  </div>
</div>
<script>
(function () {
  var INPUT_SEL = '.kidinput';
  var GO_ID = 'inv-go';
  var pad = document.getElementById('kidpad'), target = null;
  var coarse = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
  if (!pad || !coarse) { if (pad) pad.remove(); return; }

  var inp = document.querySelector(INPUT_SEL);
  if (inp) { inp.setAttribute('inputmode', 'none'); }

  document.addEventListener('focusin', function (e) {
    var t = e.target;
    if (t && t.matches && t.matches(INPUT_SEL)) {
      target = t; pad.classList.add('show'); pad.setAttribute('aria-hidden', 'false');
      setTimeout(function () { try { t.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (err) {} }, 60);
    } else if (!(t && t.closest && t.closest('#kidpad'))) {
      target = null; pad.classList.remove('show'); pad.setAttribute('aria-hidden', 'true');
    }
  });

  function caret(t) { try { var s = t.selectionStart; if (typeof s === 'number') return s; } catch (err) {} return t.value.length; }

  pad.addEventListener('pointerdown', function (e) {
    var b = e.target.closest ? e.target.closest('button') : null;
    if (!b) return;
    e.preventDefault();
    if (!target) target = document.querySelector(INPUT_SEL);
    if (!target) return;
    var k = b.getAttribute('data-k'), v = target.value;
    if (k === 'mic') { toggleMic(); return; }
    if (k === 'back') { target.value = v.slice(0, Math.max(0, caret(target) - 1)) + v.slice(caret(target) + ((v.length > caret(target)) ? 1 : 0)); }
    else if (k === 'go') { var go = document.getElementById(GO_ID); if (go) go.click(); return; }
    else if (k === '-') { target.value = (v.charAt(0) === '-') ? v.slice(1) : (v === '' ? '-' : '-' + v); }
    else if (k === '.') { if (v.indexOf('.') === -1) target.value = (v === '' || v === '-') ? v + '0.' : v + '.'; }
    else { var c = caret(target); target.value = v.slice(0, c) + k + v.slice(c); }
    target.dispatchEvent(new Event('input', { bubbles: true }));
  });

  /* ---- 🎤 voice-to-number ---- */
  var kstatus = document.getElementById('kpstatus'), statTimer = null, rec = null, listening = false;
  function status(msg) {
    if (!kstatus) return;
    kstatus.textContent = msg || '';
    if (statTimer) clearTimeout(statTimer);
    if (msg) statTimer = setTimeout(function () { kstatus.textContent = ''; }, 5000);
  }
  var UN = { zero: 0, one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9, ten: 10, eleven: 11, twelve: 12, thirteen: 13, fourteen: 14, fifteen: 15, sixteen: 16, seventeen: 17, eighteen: 18, nineteen: 19, twenty: 20, thirty: 30, forty: 40, fifty: 50, sixty: 60, seventy: 70, eighty: 80, ninety: 90, hundred: 100 };
  function heardToNumber(text) {
    var s = ' ' + String(text).toLowerCase() + ' ', total = 0, cur = null;
    s = s.replace(/[^a-z0-9 ]/g, ' ').split(/\s+/).forEach(function (t) {
      if (t in UN) { cur = (cur === null) ? UN[t] : cur + UN[t]; }
      else if (/^\d+$/.test(t)) { cur = (cur === null) ? parseInt(t, 10) : parseInt(String(cur) + t, 10); }
    });
    return cur === null ? null : cur;
  }
  function toggleMic() {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { status('🎤 Voice is not available here — type with the keypad.'); return; }
    if (listening) { try { rec.stop(); } catch (e) {} listening = false; return; }
    try {
      rec = new SR(); rec.lang = 'en-IN'; rec.interimResults = false;
      listening = true; status('🎤 Listening… say the number');
      rec.onresult = function (e) {
        var said = e.results[0][0].transcript;
        listening = false;
        var n = heardToNumber(said);
        status('I heard: “' + said + '”' + (n !== null ? ' → ' + n : ''));
        if (n !== null && target) {
          target.value = String(n);
          target.dispatchEvent(new Event('input', { bubbles: true }));
        }
      };
      rec.onerror = function () { listening = false; status('🎤 Could not hear that — try again.'); };
      rec.onend = function () { listening = false; };
      rec.start();
    } catch (e) { listening = false; status('🎤 The microphone needs permission on this device.'); }
  }
})();
</script>
<script src="../version.js?v=31"></script>
