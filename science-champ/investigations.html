<html lang="en">
<head>
<meta charset="UTF-8">

<title>Investigations · Science-Champ</title>

<style>
  .inv-wrap { max-width: 780px; margin: 0 auto; padding: 16px 14px 120px; }
  .inv-lead { color: #7a6f60; line-height: 1.5; margin: 0 0 18px; text-align: center; }
  .inv-note { color: #7a6f60; font-size: 15px; line-height: 1.5; background: #f3ead7; border-radius: 12px; padding: 12px 14px; margin-top: 16px; }
  .inv-grid { display: grid; gap: 12px; }
  .inv-card { display: flex; gap: 14px; align-items: center; background: #fffdf7; border: 1.5px solid rgba(43,38,32,.14); border-radius: 16px; padding: 14px; cursor: pointer; transition: all .15s; }
  .inv-card:hover { transform: translateY(-2px); border-color: #66bb6a; box-shadow: 0 6px 16px rgba(46,125,50,.12); }
  .inv-card.done { border-color: #9ccc65; background: linear-gradient(135deg, #f1f8e9, #fffdf7 65%); }
  .inv-icon { font-size: 2rem; width: 54px; height: 54px; display: flex; align-items: center; justify-content: center; background: #f3ead7; border-radius: 14px; flex: none; }
  .inv-body { flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .inv-body b { font-size: 1.06rem; }
  .inv-subj { color: #2e7d32; font-weight: 800; font-size: 14.5px; }
  .inv-st { color: #7a6f60; font-size: 14.5px; font-weight: 700; }
  .inv-go { font-size: 1.5rem; color: #2e7d32; font-weight: 900; }
  .inv-scene { background: #fffdf7; border: 1.5px solid rgba(43,38,32,.14); border-radius: 18px; padding: 18px; box-shadow: 0 3px 14px rgba(43,38,32,.06); }
  .inv-dotrow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .inv-dot { width: 12px; height: 12px; border-radius: 50%; background: #f3ead7; border: 2px solid rgba(43,38,32,.14); }
  .inv-dot.done { background: #c8e6c9; border-color: #66bb6a; }
  .inv-dot.cur { background: #2e7d32; border-color: #2e7d32; }
  .inv-name { font-weight: 800; color: #7a6f60; margin-left: auto; }
  .inv-mystery { background: #e3f2fd; border-radius: 12px; padding: 12px 14px; line-height: 1.5; }
  .inv-q { font-weight: 800; font-size: 1.06rem; line-height: 1.5; margin: 14px 0 10px; }
  .inv-small { color: #7a6f60; font-size: 15px; }
  .inv-opts { display: grid; gap: 10px; margin: 8px 0; }
  .inv-opt { text-align: left; background: #fbf4e4; border: 2px solid rgba(43,38,32,.25); border-radius: 14px; padding: 12px 14px; cursor: pointer; font-family: inherit; font-size: 16.5px; color: #2b2620; }
  .inv-opt:hover { border-color: #2e7d32; background: rgba(46,125,50,.10); }
  .inv-opt.sel { border-color: #2e7d32; background: rgba(46,125,50,.10); }
  .inv-opt.used { opacity: .35; cursor: default; }
  .inv-clueq { font-weight: 800; margin: 14px 0 2px; color: #1b5e20; }
  .inv-slots { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
  .inv-slot { min-width: 60px; min-height: 46px; border: 2px dashed rgba(43,38,32,.25); border-radius: 12px; display: flex; align-items: center; justify-content: center; padding: 6px 10px; font-weight: 800; color: #7a6f60; background: #f3ead7; text-align: center; font-size: 14.5px; }
  .inv-slot.full { border-style: solid; border-color: #2e7d32; background: rgba(46,125,50,.10); color: #2b2620; }
  .inv-ansrow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .inv-in { font-family: inherit; font-size: 1.5rem; font-weight: 800; padding: 10px 14px; border-radius: 12px; border: 2px solid rgba(43,38,32,.25); width: min(300px, 100%); background: #fff; }
  .inv-pad { border: 2px solid rgba(43,38,32,.25); border-radius: 14px; background:
    repeating-linear-gradient(0deg, transparent 0 23px, rgba(43,38,32,.08) 23px 24px),
    repeating-linear-gradient(90deg, transparent 0 23px, rgba(43,38,32,.08) 23px 24px), #fff; max-width: 100%; touch-action: none; cursor: crosshair; }
  .inv-padwrap { text-align: center; margin: 10px 0; }
  .inv-btn { font-family: inherit; font-size: 1.1rem; font-weight: 800; padding: 12px 22px; border-radius: 14px; border: none; background: linear-gradient(135deg, #66bb6a, #2e7d32); color: #fff; cursor: pointer; box-shadow: 0 3px 0 #1b5e20; }
  .inv-btn:active { transform: translateY(2px); box-shadow: none; }
  .inv-btn.sec { background: #fbf4e4; color: #2b2620; border: 2px solid rgba(43,38,32,.25); box-shadow: none; }
  .inv-btn.tiny { font-size: .92rem; padding: 8px 14px; }
  .inv-actions { margin-top: 10px; }
  .inv-fb { border-radius: 12px; padding: 10px 14px; font-weight: 700; margin-top: 12px; }
  .inv-fb.info { background: #f3ead7; }
  .inv-fb.bad { background: #ffe0b2; color: #8a4b00; }
  .inv-fb.win { background: #c8e6c9; color: #047857; }
  .inv-note-inline { background: #f1f8e9; border-left: 5px solid #66bb6a; border-radius: 10px; padding: 12px 14px; margin-top: 12px; line-height: 1.5; }
</style>
</head>
