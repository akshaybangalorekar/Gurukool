<html lang="en">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  body { padding-bottom: env(safe-area-inset-bottom); }
  .s-wrap { max-width: 760px; margin: 0 auto; padding: 26px 22px 70px; }
  .s-h1 { font-family: Baloo 2, Nunito, sans-serif; font-weight: 800; font-size: 32px; color: #0f172a; margin: 4px 0 6px; }
  .s-lead { color: #64748b; font-size: 17px; line-height: 1.6; margin: 0 0 18px; }
  .s-panel { background: #fff; border: 1px solid #e6ebf1; border-radius: 20px; padding: 20px; }
  .s-row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid #f1f5f9; }
  .s-row:last-child { border-bottom: none; }
  .s-row .dot { width: 26px; height: 26px; border-radius: 50%; background: #f1f5f9; color: #94a3b8; font: 800 14px Nunito, system-ui, sans-serif; display: flex; align-items: center; justify-content: center; flex: 0 0 26px; }
  .s-row.now .dot { background: #2a9d8f; color: #fff; }
  .s-row.done .dot { background: #34d399; color: #fff; }
  .s-row b { font: 800 17px Nunito, system-ui, sans-serif; color: #0f172a; display: block; }
  .s-row span { color: #64748b; font-size: 15px; }
  .s-row .mins { margin-left: auto; color: #94a3b8; font-weight: 700; font-size: 14.5px; white-space: nowrap; }
  .s-btn { font: 800 17px Nunito, system-ui, sans-serif; padding: 14px 20px; border-radius: 14px; border: 2px solid #cbd5e1; background: #fff; color: #334155; cursor: pointer; margin: 6px 8px 0 0; }
  .s-btn.p { background: #2a9d8f; border-color: #2a9d8f; color: #fff; }
  .s-bar { height: 8px; border-radius: 999px; background: #e2e8f0; overflow: hidden; margin: 4px 0 16px; }
  .s-bar div { height: 100%; background: #2a9d8f; width: 0; transition: width .3s; }
  .s-clock { color: #64748b; font-weight: 800; font-size: 15px; }
  .s-q { font: 800 22px/1.5 Nunito, system-ui, sans-serif; color: #0f172a; margin: 8px 0 14px; }
  .s-scene { background: #f0f9ff; border: 1px solid #bae6fd; border-radius: 12px; padding: 12px 15px; margin: 0 0 12px; color: #0c4a6e; font-size: 17px; line-height: 1.6; }
  .s-opt { display: block; width: 100%; text-align: left; font: 700 17.5px Nunito, system-ui, sans-serif; padding: 14px 16px; border: 2px solid #cbd5e1; background: #fff; color: #1e293b; border-radius: 14px; margin: 0 0 10px; cursor: pointer; }
  .s-opt.ok { border-color: #34d399; background: #ecfdf5; color: #065f46; }
  .s-opt.no { border-color: #fca5a5; background: #fef2f2; color: #991b1b; }
  .s-in { font: 800 21px Space Mono, ui-monospace, monospace; padding: 11px 13px; border: 2px solid #cbd5e1; border-radius: 12px; width: 160px; }
  .s-fb { font: 700 17px Nunito, system-ui, sans-serif; margin: 12px 0 0; min-height: 24px; }
  .s-fb.ok { color: #047857; } .s-fb.no { color: #b45309; }
  .s-know { background: #fffbeb; border: 1px solid #fcd34d; border-radius: 12px; padding: 12px 16px; margin: 12px 0; }
  .s-know li { font-size: 17px; line-height: 1.6; }
  .s-sol { background: #f5f3ff; border: 1px solid #c4b5fd; border-radius: 12px; padding: 14px 16px; margin-top: 12px; font-size: 17px; line-height: 1.7; }
  .s-note { background: #f0fdf4; border: 1px solid #86efac; border-radius: 12px; padding: 12px 14px; color: #166534; font-weight: 700; font-size: 15.5px; margin-top: 16px; }
  .s-lesson { background: #fff; border: 1px solid #e6ebf1; border-radius: 20px; padding: 20px; }
  .s-lesson h2 { font-family: Baloo 2, Nunito, sans-serif; font-weight: 800; font-size: 24px; color: #0f172a; margin: 0 0 10px; }
  .s-lesson p { font-size: 17.5px; line-height: 1.75; color: #334155; margin: 0 0 12px; }
  .s-lesson .nug { background: #f0fdfa; border-left: 5px solid #2a9d8f; border-radius: 10px; padding: 10px 14px; margin: 8px 0; font-size: 16.5px; color: #134e4a; }
  .s-bball { background: linear-gradient(135deg,#2a9d8f,#1d7d72); border-radius: 18px; padding: 16px 18px; color: #fff; margin: 0 0 18px; font-weight: 800; font-size: 17px; line-height: 1.5; }
  .s-bball b { display: block; font-size: 20px; margin-bottom: 3px; }
</style>
</head>
<body>
  <header class="topnav" id="topnav"></header>
  <main class="s-wrap"><div id="s-view"></div></main>
  <script src="../version.js?v=52"></script>
  <script src="../gk-fresh.js?v=52"></script>
  <script src="../rhythm.js?v=52"></script>
  <script src="assets/content.js?v=52"></script>
  <script src="assets/session.js?v=52"></script>
  <script src="../champ-rail.js?v=52"></script>
  <script src="assets/nav.js?v=52"></script>
  <script>
  (function () {
    function el(id) { return document.getElementById(id); }
    function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    function norm(v) { return String(v == null ? '' : v).trim().toLowerCase().replace(/\s+/g, ' '); }
    function numOf(v) { var m = norm(v).match(/-?\d+(\.\d+)?/); return m ? parseFloat(m[0]) : null; }
    function matches(g, q) {
      var a = norm(g), b = norm(q.ans); if (!a) return false; if (a === b) return true;
      var alts = (q.alts || []).map(norm); if (alts.indexOf(a) >= 0) return true;
      var x = numOf(a), y = numOf(b);
      return (x !== null && y !== null && Math.abs(x - y) < 1e-9);
    }

    SciSession.ready();
    var rec = SciSession.today();
    var plan = rec.plan;
    var si = Math.min(rec.progress || 0, Math.max(0, plan.stages.length - 1));
    var qi = 0, tries = 0, stageRight = 0, answered = false;

    function stageRows() {
      return plan.stages.map(function (st, i) {
        var cls = i < si ? 'done' : (i === si ? 'now' : '');
        return '<div class="s-row ' + cls + '"><span class="dot">' + (i < si ? '✓' : (i + 1)) + '</span>' +
          '<span><b>' + esc(st.title) + '</b><span>' + esc(st.blurb || '') + '</span></span>' +
          '<span class="mins">' + st.mins + ' min</span></div>';
      }).join('');
    }
    function progressPct() { return Math.round(100 * si / plan.stages.length); }

    function ready() {
      var last = SciSession.lastResult();
      el('s-view').innerHTML = '<h1 class="s-h1">🔎 Today\'s investigation</h1>' +
        '<p class="s-lead">' + esc(plan.reason) + ' About ' + plan.mins + ' minutes, in five short parts. You do not have to decide anything — just press start.</p>' +
        '<div class="s-panel">' + stageRows() + '</div>' +
        '<button class="s-btn p" onclick="Sess.start()">▶ Start today\'s investigation</button>' +
        (last ? '<p class="s-lead" style="margin-top:14px">Last time: ' + last.right + ' of ' + last.total + ' questions right.</p>' : '') +
        '<div class="s-note">🔒 Tomorrow\'s investigation is prepared for you as soon as you finish this one.</div>';
    }

    function head() {
      return '<div class="s-bar"><div style="width:' + progressPct() + '%"></div></div>' +
        '<div class="s-clock">Part ' + (si + 1) + ' of ' + plan.stages.length + ' · ' + esc(plan.stages[si].title) + ' · ' + plan.stages[si].mins + ' min</div>';
    }

    function renderStage() {
      var st = plan.stages[si];
      if (!st) return finish();

      if (st.type === 'lesson') {
        var L = st.lesson;
        var html = head() + '<div class="s-lesson" style="margin-top:14px">';
        if (L) {
          html += '<h2>' + esc(L.t || st.worldName) + '</h2>' + '<p>' + esc(L.b || '') + '</p>';
          if (L.moves) html += '<div class="nug"><b>How it moves:</b> ' + esc(L.moves) + '</div>';
          if (L.tip) html += '<div class="nug"><b>Olympiad tip:</b> ' + esc(L.tip) + '</div>';
          if (L.law) html += '<div class="nug"><b>The law:</b> ' + esc(L.law) + '</div>';
          if (L.fact) html += '<div class="nug"><b>Fun fact:</b> ' + esc(L.fact) + '</div>';
        } else {
          html += '<h2>' + esc(st.worldName) + '</h2><p>This world is ready for you.</p>';
        }
        html += '<p class="s-lead" style="margin-top:14px">Read it once, slowly. Then prove you have got it — the next part asks you questions about it.</p>' +
          '<button class="s-btn p" onclick="Sess.nextStage()">I have read it — carry on →</button></div>';
        el('s-view').innerHTML = html;
        return;
      }

      if (st.type === 'hard' && !st.qs.length) {
        el('s-view').innerHTML = head() + '<div class="s-panel" style="margin-top:14px"><p class="s-q">One hard one</p>' +
          '<p class="s-lead">There is no harder question for this world yet. You have done well to get here.</p>' +
          '<button class="s-btn p" onclick="Sess.nextStage()">Finish the session →</button></div>';
        return;
      }

      var q = st.qs[qi];
      if (!q) return finish();
      answered = false;
      var h = head() + '<div class="s-panel" style="margin-top:14px">' +
        '<div class="s-clock">Question ' + (qi + 1) + ' of ' + st.qs.length + ' · ' + esc(q.wname || '') + '</div>';
      if (q.scene) h += '<div class="s-scene"><b>' + esc(q.scene) + '</b></div>';
      h += '<p class="s-q">' + esc(q.q) + '</p>';

      if (q.kind === 'mcq') {
        h += (q.o || []).map(function (o, i) {
          return '<button class="s-opt" id="s-opt-' + i + '" onclick="Sess.pick(' + i + ')">' + String.fromCharCode(65 + i) + '. ' + esc(o) + '</button>';
        }).join('');
      } else {
        h += '<input class="s-in" id="s-in" inputmode="text" autocomplete="off" placeholder="answer"> ' +
          '<button class="s-btn p" onclick="Sess.check()">Check</button>';
      }
      h += '<button class="s-btn" id="s-know-btn" onclick="Sess.know()">What do we know?</button>' +
        '<p class="s-fb" id="s-fb"></p><div id="s-know"></div><div id="s-sol"></div></div>';
      el('s-view').innerHTML = h;
      var inp = el('s-in');
      if (inp) { inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); Sess.check(); } }); inp.focus(); }
    }

    function credit(q, firstTry) {
      var xp = firstTry ? 12 : 6;
      SciSession.award(xp);
      SciSession.record(q.wid, 1, 1);
      if (window.Rhythm) Rhythm.note(true);
      return xp;
    }
    function debit(q) {
      SciSession.record(q.wid, 0, 1);
      if (window.Rhythm) Rhythm.note(false);
    }
    function advance() {
      var st = plan.stages[si];
      qi++; tries = 0;
      if (qi >= st.qs.length) Sess.nextStage(); else renderStage();
    }
    function solved(q, fb) {
      fb.className = 's-fb ok';
      fb.innerHTML += ' <b>That part is done.</b>';
      el('s-sol').innerHTML = '<button class="s-btn p" onclick="Sess.nextStage()">Carry on →</button>';
    }

    function finish() {
      var stats = SciSession.finish();
      el('s-view').innerHTML = '<h1 class="s-h1">Investigation complete ✅</h1>' +
        '<div class="s-panel"><p class="s-q">' + stats.right + ' of ' + stats.total + ' questions right</p>' +
        '<p class="s-lead">That is a real session — the kind that builds a champion. Stopping here is a smart move, not a small one.</p>' +
        '<div class="s-note">🔒 Tomorrow\'s investigation is already prepared, built from what you did today.</div>' +
        '<div style="margin-top:16px"><a class="s-btn p" style="text-decoration:none" href="index.html">Back home</a>' +
        '<a class="s-btn" style="text-decoration:none" href="learn.html">Teach me a world</a></div></div>';
      if (window.ScienceNav && ScienceNav.top) ScienceNav.top();
    }

    window.Sess = {
      start: function () { si = 0; qi = 0; stageRight = 0; renderStage(); },
      nextStage: function () {
        var st = plan.stages[si];
        SciSession.markDone(si, stageRight, (st.qs || []).length);
        si++; qi = 0; stageRight = 0; tries = 0;
        SciSession.progress(si);
        if (si >= plan.stages.length) finish(); else renderStage();
      },
      know: function () {
        var q = plan.stages[si].qs[qi];
        el('s-know').innerHTML = '<div class="s-know"><b>What we know:</b><ul>' + (q.hints || []).map(function (k) { return '<li>' + esc(k) + '</li>'; }).join('') + '</ul></div>';
        el('s-know-btn').disabled = true;
      },
      pick: function (i) {
        if (answered) return;
        var st = plan.stages[si], q = st.qs[qi], fb = el('s-fb');
        var btn = el('s-opt-' + i);
        if (i === q.a) {
          answered = true;
          btn.className = 's-opt ok';
          var xp = credit(q, tries === 0); stageRight++;
          fb.className = 's-fb ok'; fb.innerHTML = 'Correct — that is the technique. +' + xp + ' XP';
          qi++; tries = 0;
          if (qi >= st.qs.length) solved(q, fb);
          else el('s-sol').innerHTML = '<button class="s-btn p" onclick="Sess.nextQuestion()">Next question →</button>';
          return;
        }
        tries++;
        debit(q);
        btn.className = 's-opt no'; btn.disabled = true;
        fb.className = 's-fb no';
        if (tries === 1) fb.textContent = 'Not quite. ' + (q.hints[0] || 'Read it again slowly.');
        else {
          fb.textContent = 'Let us look at it — then carry on.';
          el('s-opt-' + q.a).className = 's-opt ok';
          el('s-sol').innerHTML = '<div class="s-sol"><b>How it works</b><p style="margin:8px 0 0">' + esc(q.sol || '') + '</p>' +
            '<button class="s-btn p" style="margin-top:12px" onclick="Sess.nextQuestion()">Carry on</button></div>';
          answered = true;
          qi++;
        }
      },
      nextQuestion: function () {
        var st = plan.stages[si];
        if (qi >= st.qs.length) Sess.nextStage(); else renderStage();
      },
      check: function () {
        if (answered) return;
        var st = plan.stages[si], q = st.qs[qi], fb = el('s-fb'), v = el('s-in').value;
        if (!norm(v)) { fb.className = 's-fb no'; fb.textContent = 'Type your answer first — a guess is fine.'; return; }
        if (matches(v, q)) {
          answered = true;
          var xp = credit(q, tries === 0); stageRight++;
          fb.className = 's-fb ok'; fb.innerHTML = 'Correct — that is the technique. +' + xp + ' XP';
          qi++; tries = 0;
          if (qi >= st.qs.length) solved(q, fb);
          else el('s-sol').innerHTML = '<button class="s-btn p" onclick="Sess.nextQuestion()">Next question →</button>';
          return;
        }
        tries++;
        debit(q);
        fb.className = 's-fb no';
        if (tries === 1) fb.textContent = 'Not yet. ' + (q.hints[0] || 'Read it again slowly.');
        else {
          fb.textContent = 'Let us look at it — then carry on.';
          el('s-sol').innerHTML = '<div class="s-sol"><b>How it works</b><p style="margin:8px 0 0">' + esc(q.sol || '') + '</p>' +
            '<button class="s-btn p" style="margin-top:12px" onclick="Sess.nextQuestion()">Carry on</button></div>';
          answered = true;
          qi++;
        }
      }
    };
    ready();
  })();
  </script>
  <script src="../kidpad.js?v=58"></script>
</body>
</html>
