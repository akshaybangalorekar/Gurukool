<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="../icon.png" type="image/png">
<link rel="apple-touch-icon" href="../icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="../manifest.json">
<meta name="apple-mobile-web-app-title" content="Gurukool">
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Science-Champ — Build something real</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
<style>
  body { padding-bottom: env(safe-area-inset-bottom); }
  .p-wrap { max-width: 840px; margin: 0 auto; padding: 26px 22px 70px; }
  .p-h1 { font-family: Baloo 2, Nunito, sans-serif; font-weight: 800; font-size: 32px; color: #0f172a; margin: 4px 0 6px; }
  .p-lead { color: #64748b; font-size: 17px; line-height: 1.6; margin: 0 0 20px; }
  .p-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
  @media (min-width: 700px) { .p-grid { grid-template-columns: repeat(2, 1fr); } }
  .p-card { background: #fff; border: 1px solid #e6ebf1; border-left: 6px solid #2a9d8f; border-radius: 18px; padding: 18px; box-shadow: 0 2px 10px rgba(15,23,42,.04); }
  .p-card.locked { border-left-color: #cbd5e1; background: #f8fafc; }
  .p-card .ico { font-size: 26px; }
  .p-card b { display: block; font: 800 20px/1.25 Nunito, system-ui, sans-serif; color: #0f172a; margin-top: 6px; }
  .p-card .hook { display: block; color: #64748b; font-size: 15.5px; line-height: 1.5; margin-top: 5px; }
  .p-chip { display: inline-block; margin: 10px 6px 0 0; font: 800 13px Nunito, system-ui, sans-serif; border-radius: 999px; padding: 4px 10px; background: #dcfce7; color: #166534; }
  .p-chip.no { background: #fee2e2; color: #991b1b; }
  .p-btn { font: 800 16px Nunito, system-ui, sans-serif; padding: 11px 16px; border-radius: 13px; border: 2px solid #2a9d8f; background: #2a9d8f; color: #fff; cursor: pointer; margin: 14px 6px 0 0; }
  .p-btn.ghost { background: #fff; color: #64748b; border-color: #cbd5e1; }
  .p-lock { margin-top: 12px; font: 800 15px Nunito, system-ui, sans-serif; color: #64748b; }
  .p-panel { background: #fff; border: 1px solid #e6ebf1; border-radius: 20px; padding: 20px; margin-top: 16px; }
  .p-say { background: #f8fafc; border-left: 4px solid #2a9d8f; border-radius: 10px; padding: 14px 16px; font-size: 18px; line-height: 1.7; color: #1f2937; }
  .p-q { font: 800 21px/1.5 Nunito, system-ui, sans-serif; color: #0f172a; margin: 16px 0 12px; }
  .p-in { font: 800 21px Space Mono, ui-monospace, monospace; padding: 11px 13px; border: 2px solid #cbd5e1; border-radius: 12px; width: 170px; }
  .p-fb { font: 700 17px Nunito, system-ui, sans-serif; margin: 12px 0 0; min-height: 24px; }
  .p-fb.ok { color: #047857; } .p-fb.no { color: #b45309; }
  .p-sol { background: #f5f3ff; border: 1px solid #c4b5fd; border-radius: 12px; padding: 14px 16px; margin-top: 12px; font-size: 17px; line-height: 1.7; }
  .p-dots { display: flex; gap: 6px; margin-bottom: 14px; }
  .p-dot { width: 30px; height: 6px; border-radius: 999px; background: #e2e8f0; }
  .p-dot.on { background: #2a9d8f; }
  .sp-btn { font: 800 15px Nunito, system-ui, sans-serif; padding: 10px 15px; border-radius: 12px; border: 2px solid #cbd5e1; background: #fff; color: #334155; cursor: pointer; margin: 4px 6px 0 0; }
</style>
</head>
<body>
  <header class="topnav" id="gk-head"></header>
  <main class="p-wrap"><div id="p-view"></div></main>
  <script src="../version.js?v=47"></script>
  <script src="../gk-fresh.js?v=47"></script>
  <script src="assets/content.js?v=47"></script>
  <script src="assets/app.js?v=47"></script>
  <script src="assets/projects.js?v=47"></script>
  <script src="../champ-rail.js?v=47"></script>
  <script src="assets/nav.js?v=47"></script>
  <script>
  (function () {
    ScienceNav.auto();
    function el(id) { return document.getElementById(id); }
    function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    function norm(v) { return String(v == null ? '' : v).trim().toLowerCase().replace(/\s+/g, ' '); }
    function matches(g, w) {
      var a = norm(g), b = norm(w);
      if (!a) return false;
      if (a === b) return true;
      var an = parseFloat(a.replace(/[^0-9.\-]/g, '')), bn = parseFloat(b.replace(/[^0-9.\-]/g, ''));
      if (!isNaN(an) && !isNaN(bn) && Math.abs(an - bn) < 0.06) return true;
      var sa = a.replace(/[^a-z0-9]/g, ''), sb = b.replace(/[^a-z0-9]/g, '');
      var n = Math.min(4, sa.length, sb.length);
      return (n >= 3 && sa.slice(0, n) === sb.slice(0, n));
    }
    function starsOf(id) { try { return (typeof stars === 'function') ? stars(id) : 0; } catch (e) { return 0; } }
    function load() { try { return JSON.parse(localStorage.getItem('gk_sprojects') || '{}'); } catch (e) { return {}; } }
    function save(o) { try { localStorage.setItem('gk_sprojects', JSON.stringify(o)); } catch (e) {} }
    var cur = null, stepI = 0, tries = 0;

    function hub() {
      var cards = ScienceProjects.list.map(function (p) {
        var chk = ScienceProjects.check(starsOf, p);
        var chips = p.needs.map(function (id) {
          var w = WORLDS.filter(function (x) { return x.id === id; })[0];
          var s = starsOf(id);
          return '<span class="p-chip' + (s >= 1 ? '' : ' no') + '">' + (s >= 1 ? '\u2713 ' : '\u2717 ') + esc(w ? w.name : id) + '</span>';
        }).join('');
        var ready = (p.status === 'ready'), canOpen = ready && chk.ok;
        return '<div class="p-card' + (canOpen ? '' : ' locked') + '"><span class="ico">' + p.icon + '</span><b>' + esc(p.title) + '</b>' +
          '<span class="hook">' + esc(p.hook) + '</span><div>' + chips + '</div>' +
          (canOpen ? '<button class="p-btn" onclick="SP.open(\'' + p.key + '\')">Open the project</button>'
            : (ready ? '<div class="p-lock">\ud83d\udd12 Locked. Earn one star in each world above and this opens.</div>'
              : '<div class="p-lock">\ud83d\udee0\ufe0f I am still building this one. The worlds above are what it will need.</div>')) + '</div>';
      }).join('');
      el('p-view').innerHTML = '<h1 class="p-h1">Build something real</h1>' +
        '<p class="p-lead">Three ways of doing science, and all three are real: <b>code it</b>, <b>wire it</b>, <b>research it</b>. Each project teaches one idea at a time, shows you an animation or a simulation, then asks you one question \u2014 and each one ends with you producing something of your own.</p>' +
        '<div class="p-grid">' + cards + '</div>';
    }
    function renderStep() {
      var st = cur.steps[stepI];
      var dots = cur.steps.map(function (s, i) { return '<span class="p-dot' + (i <= stepI ? ' on' : '') + '"></span>'; }).join('');
      el('p-view').innerHTML = '<button class="p-btn ghost" onclick="SP.back()">\u2039 All projects</button>' +
        '<h1 class="p-h1">' + cur.icon + ' ' + esc(cur.title) + '</h1>' +
        '<div class="p-panel"><div class="p-dots">' + dots + '</div>' +
        '<div class="p-say"><b>' + esc(st.title) + '</b><br>' + esc(st.say) + '</div>' +
        (st.anim ? '<div id="p-anim" style="margin-top:16px"></div>' : '') +
        '<p class="p-q">' + esc(st.ask) + '</p>' +
        '<input class="p-in" id="p-in" autocomplete="off" placeholder="answer"> ' +
        '<button class="p-btn" onclick="SP.check()">Check</button>' +
        '<p class="p-fb" id="p-fb"></p><div id="p-sol"></div></div>';
      if (st.anim) { var a = st.anim(); el('p-anim').innerHTML = a.html; if (a.start) a.start(); }
      var i = el('p-in');
      i.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); SP.check(); } });
      i.focus();
    }
    function done() {
      var all = load(), p = all[cur.key] = all[cur.key] || { done: 0 };
      p.done = cur.steps.length; p.at = Date.now(); save(all);
      el('p-view').innerHTML = '<h1 class="p-h1">You built it \ud83c\udf89</h1>' +
        '<div class="p-panel"><p class="p-q">' + esc(cur.title) + '</p>' +
        '<p class="p-lead">You worked the whole thing out yourself \u2014 and you finished with a real number of your own. That is what scientists and programmers do all day.</p>' +
        '<button class="p-btn" onclick="SP.back()">Back to the projects</button></div>';
      ScienceNav.top();
    }
    window.SP = {
      back: function () { cur = null; hub(); },
      open: function (key) {
        cur = ScienceProjects.byKey(key);
        if (!cur || cur.status !== 'ready' || !ScienceProjects.check(starsOf, cur).ok) { hub(); return; }
        stepI = 0; tries = 0; renderStep();
      },
      check: function () {
        var st = cur.steps[stepI], fb = el('p-fb');
        if (!norm(el('p-in').value)) { fb.className = 'p-fb no'; fb.textContent = 'Have a go, a guess is fine.'; return; }
        if (matches(el('p-in').value, st.ans)) {
          fb.className = 'p-fb ok'; fb.innerHTML = 'Yes.';
          el('p-sol').innerHTML = '<div class="p-sol">' + esc(st.sol) + '</div>' +
            '<button class="p-btn" style="margin-top:12px" onclick="SP.next()">' + (stepI + 1 >= cur.steps.length ? 'Finish the project' : 'Next step \u2192') + '</button>';
          return;
        }
        tries++;
        fb.className = 'p-fb no';
        if (tries === 1) fb.textContent = 'Not yet. ' + st.hint;
        else { fb.textContent = 'Here is the way through it.'; el('p-sol').innerHTML = '<div class="p-sol">' + esc(st.sol) + '</div><button class="p-btn" style="margin-top:12px" onclick="SP.next()">Carry on</button>'; }
      },
      next: function () { tries = 0; stepI++; if (stepI >= cur.steps.length) done(); else renderStep(); }
    };
    hub();
  })();
  </script>
</body>
</html>
