<style>
  .h-wrap { max-width: 780px; margin: 0 auto; padding: 26px 22px 190px; }
  .h-h1 { font-family: Baloo 2, Nunito, sans-serif; font-weight: 800; font-size: 32px; color: #0f172a; margin: 4px 0 6px; }
  .h-lead { color: #64748b; font-size: 17px; line-height: 1.6; margin: 0 0 18px; }
  .h-panel { background: #fff; border: 1px solid #e6ebf1; border-radius: 20px; padding: 20px; }
  .h-card { background: #fff; border: 1px solid #e6ebf1; border-left: 6px solid #0ea5e9; border-radius: 18px; padding: 16px 18px; margin: 0 0 14px; }
  .h-card.picked { border-left-color: #2e7d32; background: #f7fdf6; }
  .h-q { font: 700 17.5px/1.6 Nunito, system-ui, sans-serif; color: #1e293b; background: #f8fafc; border-radius: 12px; padding: 12px 14px; margin: 0 0 8px; }
  .h-ans { font: 800 16px Nunito, system-ui, sans-serif; color: #047857; margin: 0 0 10px; }
  .h-steps { margin: 0 0 12px; padding-left: 20px; }
  .h-steps li { font-size: 16px; line-height: 1.6; color: #475569; }
  .h-btn { font: 800 16.5px Nunito, system-ui, sans-serif; padding: 12px 18px; border-radius: 13px; border: 2px solid #cbd5e1; background: #fff; color: #334155; cursor: pointer; margin: 4px 8px 0 0; }
  .h-btn.p { background: #0ea5e9; border-color: #0ea5e9; color: #fff; }
  .h-btn.big { font-size: 18px; padding: 16px 22px; }
  .h-btn.small { font-size: 15px; padding: 9px 13px; }
  .h-opt { display: block; width: 100%; text-align: left; font: 800 19px Nunito, system-ui, sans-serif; padding: 15px 18px; border: 2px solid #cbd5e1; background: #fff; color: #1e293b; border-radius: 14px; margin: 0 0 10px; cursor: pointer; }
  .h-opt.ok { border-color: #34d399; background: #ecfdf5; color: #065f46; }
  .h-opt.no { border-color: #fca5a5; background: #fef2f2; color: #991b1b; }
  .h-fb { font: 800 18px Nunito, system-ui, sans-serif; margin: 14px 0 0; min-height: 26px; }
  .h-fb.ok { color: #047857; } .h-fb.no { color: #b45309; }
  .h-sol { background: #f0f9ff; border: 1px solid #bae6fd; border-radius: 12px; padding: 14px 16px; margin-top: 12px; font-size: 17px; line-height: 1.7; }
  .h-clock { display: flex; align-items: center; gap: 12px; margin: 0 0 14px; }
  .h-bar { flex: 1; height: 10px; border-radius: 999px; background: #e2e8f0; overflow: hidden; }
  .h-bar div { height: 100%; background: #0ea5e9; width: 100%; transition: width 1s linear; }
  .h-time { font: 800 17px Nunito, system-ui, sans-serif; color: #0f172a; white-space: nowrap; }
  .h-chip { display: inline-block; font: 800 13.5px Nunito, system-ui, sans-serif; border-radius: 999px; padding: 4px 11px; background: #e0f2fe; color: #075985; margin: 0 6px 6px 0; }
  .h-note { background: #fffbeb; border: 1px solid #fcd34d; border-radius: 12px; padding: 12px 14px; font-size: 16px; color: #78350f; margin-top: 14px; }
  /* the assignment rows */
  .hw-row { display: flex; gap: 14px; align-items: flex-start; }
  .hw-tick { flex: 0 0 auto; width: 44px; height: 44px; border-radius: 12px; border: 2px solid #cbd5e1; background: #fff; font-size: 24px; line-height: 1; cursor: pointer; color: #94a3b8; }
  .hw-tick.on { border-color: #2e7d32; background: #e8f5e9; color: #2e7d32; }
  .hw-main { flex: 1; min-width: 0; }
  .hw-topic { font: 800 19.5px Nunito, system-ui, sans-serif; color: #0f172a; margin: 0 0 2px; }
  .hw-given { font: 700 15px Nunito, system-ui, sans-serif; color: #7a6f60; margin: 0 0 8px; }
  .hw-covers { font-size: 15.5px; line-height: 1.55; color: #475569; margin: 0 0 8px; }
  .hw-acts { margin-top: 6px; }
  /* the action bar */
  .hw-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 800; background: rgba(15,23,42,.96);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); display: none; }
  .hw-bar.on { display: block; }
  .hw-bar .hw-count { color: #f8fafc; font: 800 16px Nunito, system-ui, sans-serif; margin: 0 0 8px; }
  .hw-bar button { font: 800 16.5px Nunito, system-ui, sans-serif; padding: 13px 16px; border-radius: 13px; border: 0; margin: 0 8px 6px 0; cursor: pointer; background: #f8fafc; color: #0f172a; }
  .hw-bar button.go { background: #0ea5e9; color: #fff; }
  .hw-bar button.teach { background: #2e7d32; color: #fff; }
  body.hw-bar-open .h-wrap { padding-bottom: 200px; }
</style>

<body>
  <header class="topnav" id="topnav"></header>
  <main class="h-wrap"><div id="h-view"></div></main>
  <div class="hw-bar" id="hw-bar"></div>
  <script src="../version.js?v=79"></script>
  <script src="../hw-sheets.js?v=79"></script>
  <script src="../gk-fresh.js?v=79"></script>
  <script src="../rhythm.js?v=79"></script>
  <script src="assets/app.js?v=79"></script>
  <script src="assets/gen.js?v=79"></script>
  <script src="assets/hw-au7-sheet.js?v=79"></script>
  <script src="assets/hw-au7-art.js?v=79"></script>
  <script src="assets/hw-au7.js?v=79"></script>
  <script src="assets/homework.js?v=79"></script>
  <script src="../champ-rail.js?v=79"></script>
  <script src="assets/nav.js?v=79"></script>
  <script>MathNav.mount('homework'); MathNav.top();</script>
  <script>
  (function () {
    var KEY = 'gk_hw';
    function load() { try { return JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { return {}; } }
    function save(o) { try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) {} }
    function el(id) { return document.getElementById(id); }
    function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

    var S = { view: 'list', picked: {}, sheets: {}, sheetOpen: null, on: false, ends: 0, total: 0, n: 0, right: 0, q: null, answered: false, tick: null, types: [], mode: 'mixed', typeId: null };
    var TICK = '\u2611', BLANK = '\u2610';

    /* ---------- what each assignment has been doing ---------- */
    function statsFor(a) {
      var rec = load(), n = 0, right = 0;
      (a.types || []).forEach(function (t) {
        var r = rec[t];
        if (r) { n += (r.n || 0); right += (r.right || 0); }
      });
      return { n: n, right: right, pct: n ? Math.round(100 * right / n) : null };
    }

    /* ---------- the sheets the teacher gave ---------- */
    /* Draw the assignments straight away. If a sheet turns up afterwards, the
       list is redrawn with the "See the sheet" button on it. Never wait. */
    function loadSheets(cb) {
      cb && cb();
      if (!window.HWSheets) return;
      HWSheets.all().then(function (m) {
        var had = Object.keys(S.sheets || {}).length;
        S.sheets = m || {};
        if (Object.keys(S.sheets).length !== had && S.view === 'list') list();
      }).catch(function () {});
    }
    function sheetView(id) {
      var a = HW.assignments().filter(function (x) { return x.id === id; })[0] || {};
      HWSheets.get(id).then(function (rec) {
        if (!rec || !rec.url) return;
        var body;
        if (HWSheets.isPdf(rec.type)) {
          body = '<iframe src="' + rec.url + '" style="width:100%;height:70vh;border:1px solid #e6ebf1;border-radius:12px"></iframe>' +
                 '<p style="margin:10px 0 0"><a class="h-btn small" href="' + rec.url + '" target="_blank" rel="noopener">Open the sheet in a new window</a></p>';
        } else {
          body = '<img src="' + rec.url + '" alt="The homework sheet" style="width:100%;border-radius:12px;border:1px solid #e6ebf1">';
        }
        el('h-view').innerHTML = '<h1 class="h-h1">\ud83d\udcc4 ' + esc(a.topic || 'The sheet') + '</h1>' +
          '<p class="h-lead">The sheet your teacher gave, exactly as it came home. ' +
          'Use it beside the practice \u2014 the questions you get are fresh, but they are the same kinds.</p>' +
          '<div class="h-panel">' + body + '</div>' +
          '<button class="h-btn p big" style="margin-top:14px" onclick="HWClub.back()">Back to the assignments</button>';
      }).catch(function () {});
    }

    /* ---------- the list ---------- */
    function list() {
      stopClock();
      S.view = 'list'; S.on = false;
      var list = HW.assignments();
      var h = '<h1 class="h-h1">\ud83d\udcd8 Homework Club</h1>' +
        '<p class="h-lead">Every piece of homework your teacher set, with the date it was given. ' +
        'Tick the ones you want \u2014 tick two or three if you like \u2014 then choose how long to practise, or ask to be taught one.</p>';
      if (!list.length) {
        h += '<div class="h-note">No assignments on this device yet. A grown-up can add one from the Parent Console.</div>';
      }
      list.forEach(function (a) {
        var st = statsFor(a), on = !!S.picked[a.id], ready = (a.types || []).length > 0;
        var sheetBtn = S.sheets[a.id] ? '<button class="h-btn small" style="border-color:#2e7d32;color:#2e7d32" onclick="HWClub.sheet(\'' + a.id + '\')">See the sheet</button>' : '';
        h += '<div class="h-card' + (on ? ' picked' : '') + '"><div class="hw-row">' +
          (ready
            ? '<button class="hw-tick' + (on ? ' on' : '') + '" onclick="HWClub.toggle(\'' + a.id + '\')" aria-label="Tick this assignment">' + (on ? TICK : BLANK) + '</button>'
            : '<span class="hw-tick" style="border-style:dashed;color:#cbd5e1;cursor:default" aria-hidden="true">\u00b7</span>') +
          '<div class="hw-main">' +
          '<p class="hw-topic">' + esc(a.topic) + '</p>' +
          '<p class="hw-given">given ' + esc(HW.prettyDate(a.given)) + '</p>' +
          '<p class="hw-covers">' + (ready
            ? (HW.teacher(a)
                ? ('Your teacher\u2019s own questions, exactly as set \u2014 the same wording and the same options. ' +
                   (HW.teacherProgress([a.id]).done >= HW.teacher(a).length
                     ? 'All done \u2014 now you can practise this topic with fresh questions.'
                     : 'Once you have tried all of them, you can practise the topic again with fresh questions.'))
                : (a.types || []).map(function (t) { var T = HW.byId(t); return esc(T ? T.name : t); }).join(' \u00b7 '))
            : 'Its questions do not exist yet \u2014 they are built from the sheet itself, ' +
              (S.sheets[a.id]
                ? 'so tap <b>Send this sheet</b>, then attach the file in your chat with Gurukool.'
                : 'so send this sheet in your chat with Gurukool and the questions will appear here.')) + '</p>' +
          '<span class="h-chip">' + (ready
            ? (st.n ? st.n + ' practised \u00b7 ' + st.pct + '% right' : 'not practised yet')
            : 'coming soon') + '</span>' +
          (ready ? '' : '<span class="h-chip" style="background:#fef3c7;color:#78350f">needs sending to Gurukool</span>') +
          (function () {
            var sheet = HW.teacher(a);
            if (!sheet) return '';
            var p = HW.teacherProgress([a.id]);
            var all = p.done >= p.total;
            return '<span class="h-chip" style="background:' + (all ? '#dcfce7;color:#166534' : '#e0e7ff;color:#3730a3') + '">' +
              (all ? 'all ' + p.total + ' done \u00b7 practice open' : 'your teacher\u2019s ' + p.total + ' questions \u00b7 ' + p.done + ' done') + '</span>';
          })() +
          '<div class="hw-acts">' + sheetBtn +
          (ready
            ? (function () {
                var sheet = HW.teacher(a);
                if (!sheet) return '<button class="h-btn small" onclick="HWClub.practiseOne(\'' + a.id + '\')">Practise just this</button>' +
                  '<button class="h-btn small" onclick="HWClub.teach(\'' + a.id + '\')">Teach me this</button>';
                var p = HW.teacherProgress([a.id]);
                if (p.done < p.total) {
                  /* nothing of Gurukool's until every question the teacher set is done */
                  return '<button class="h-btn small p" onclick="HWClub.practiseOne(\'' + a.id + '\')">Homework Pending</button>' +
                    '<button class="h-btn small" onclick="HWClub.teach(\'' + a.id + '\')">Teach me this</button>';
                }
                return '<span class="h-btn small" style="background:#dcfce7;border-color:#86efac;color:#166534;cursor:default">Homework Done</span>' +
                  '<button class="h-btn small p" onclick="HWClub.practiceMore(\'' + a.id + '\')">Practice More</button>' +
                  '<button class="h-btn small" onclick="HWClub.teach(\'' + a.id + '\')">Teach me this</button>';
              })()
            : (S.sheets[a.id]
                ? '<button class="h-btn small" style="border-color:#2e7d32;color:#2e7d32" onclick="HWClub.uploadStored(\'' + a.id + '\')">Send to Gurukool</button>' +
                  '<button class="h-btn small" onclick="HWClub.sendSheet(\'' + a.id + '\')">Send it to myself</button>'
                : '') +
              '<button class="h-btn small" style="border-color:#fca5a5;color:#b91c1c" onclick="HWClub.removeSheet(\'' + a.id + '\')">Remove this sheet</button>') +
          '</div></div></div></div>';
      });
      h += '<div class="h-note">Nothing else lives in the Homework Club \u2014 only the kinds of question your teacher actually sets.</div>';
      h += '<div style="margin-top:16px;text-align:center">' +
        '<input id="hw-add-file" type="file" accept="image/*,application/pdf" style="display:none" onchange="HWClub.addSheet(this)">' +
        '<button class="h-btn" style="font-size:15px" onclick="document.getElementById(\'hw-add-file\').click()">\u2795 Add a homework sheet</button>' +
        '<p class="h-lead" style="font-size:14.5px;margin:8px 0 0">For a grown-up: just choose the photo or the PDF. ' +
        'The topic and the date are worked out from the sheet.</p>' +
        '<p class="h-lead" id="hw-add-msg" style="font-size:15px;margin:6px 0 0;color:#047857"></p></div>';
      el('h-view').innerHTML = h;
      drawBar();
    }

    /* ---------- the action bar ---------- */
    function drawBar() {
      var bar = el('hw-bar'), picked = Object.keys(S.picked).filter(function (k) { return S.picked[k]; });
      if (S.view !== 'list' || !picked.length) {
        bar.className = 'hw-bar'; document.body.classList.remove('hw-bar-open');
        return;
      }
      var list = HW.assignments();
      var names = picked.map(function (id) {
        var a = list.filter(function (x) { return x.id === id; })[0];
        return a ? a.topic : id;
      });
      bar.className = 'hw-bar on';
      document.body.classList.add('hw-bar-open');
      bar.innerHTML = '<p class="hw-count">' + picked.length + ' selected: ' + esc(names.join(' + ')) + '</p>' +
        '<button class="go" onclick="HWClub.start(15)">15 minutes</button>' +
        '<button class="go" onclick="HWClub.start(30)">30 minutes</button>' +
        '<button class="go" onclick="HWClub.start(60)">1 hour</button>' +
        '<button class="teach" onclick="HWClub.teachPicked()">Teach me these</button>';
    }

    /* ---------- the clock ---------- */
    function startClock(mins) {
      S.ends = Date.now() + mins * 60000; S.total = mins;
      if (S.tick) clearInterval(S.tick);
      S.tick = setInterval(function () {
        var left = Math.max(0, S.ends - Date.now());
        var bar = el('h-barfill'), clock = el('h-left');
        if (bar) bar.style.width = Math.round(100 * left / (S.total * 60000)) + '%';
        if (clock) clock.textContent = fmt(left);
        if (left <= 0) finish();
      }, 1000);
    }
    function stopClock() { if (S.tick) { clearInterval(S.tick); S.tick = null; } }
    function fmt(ms) { var s = Math.ceil(ms / 1000), m = Math.floor(s / 60); s = s % 60; return m + ':' + (s < 10 ? '0' : '') + s; }

    /* ---------- a question ---------- */
    function nextQuestion() {
      if (!S.on) return;
      if (Date.now() >= S.ends) return finish();
      /* The teacher's own questions come first, in the order they were set and
         with the sheet's own options. Nothing is invented for a topic until
         every one of them has been attempted. */
      if (S.pool && S.pool.length) {
        S.q = S.pool.shift();
        S.answered = false;
        renderQuestion();
        return;
      }
      var n = S.n || 0;
      var id = S.mode === 'one' ? S.typeId : S.types[n % S.types.length];
      S.n = n + 1;
      S.q = HW.make(id);
      S.answered = false;
      renderQuestion();
    }
    function renderQuestion() {
      var q = S.q;
      el('h-view').innerHTML =
        '<div class="h-clock"><span class="h-time" id="h-left">' + fmt(Math.max(0, S.ends - Date.now())) + '</span>' +
        '<span class="h-bar"><div id="h-barfill"></div></span>' +
        '<button class="h-btn" onclick="HWClub.stop()">Finish</button></div>' +
        '<div class="h-panel"><div class="h-chip">' + esc(q.typeName) + '</div>' +
        '<div class="h-chip">' + (q.teacher
          ? 'Question ' + q.sheetNumber + ' of ' + q.sheetTotal + ' \u00b7 from your teacher\u2019s sheet'
          : 'Question ' + (S.n || 1)) + '</div>' +
        '<p class="h-q" style="font-size:19px">' + esc(q.q) + '</p>' +
        (q.art || '') +
        q.options.map(function (o, i) {
          return '<button class="h-opt" id="h-opt' + i + '" onclick="HWClub.pick(' + i + ')">' +
            String.fromCharCode(65 + i) + '.  ' + esc(o) + '</button>';
        }).join('') +
        '<button class="h-btn" id="h-know" onclick="HWClub.how()">Show me how this type works</button>' +
        '<p class="h-fb" id="h-fb"></p><div id="h-sol"></div></div>';
    }

    /* ---------- teaching ---------- */
    function teachView(ids) {
      stopClock();
      S.view = 'teach'; S.on = false;
      el('hw-bar').className = 'hw-bar'; document.body.classList.remove('hw-bar-open');
      var list = HW.assignments().filter(function (a) { return ids.indexOf(a.id) !== -1; });
      if (!list.length) return list_();
      var h = '<h1 class="h-h1">\ud83d\udcd6 Teaching' + (list.length === 1 ? ': ' + esc(list[0].topic) : ' ' + list.length + ' assignments') + '</h1>' +
        '<p class="h-lead">Read this first \u2014 no questions yet. Each kind of question on your sheet, how it works, and your teacher\u2019s own example worked out.</p>';
      list.forEach(function (a) {
        h += '<h2 style="font:800 22px Nunito;color:#0f172a;margin:22px 0 8px">' + esc(a.topic) +
             ' <span style="font:700 15px Nunito;color:#7a6f60">given ' + esc(HW.prettyDate(a.given)) + '</span></h2>';
        (a.types || []).forEach(function (tid) {
          var t = HW.byId(tid);
          if (!t) return;
          h += '<div class="h-card"><b class="hw-topic">' + t.icon + ' ' + esc(t.name) + '</b>' +
            '<div class="h-q">' + esc(t.homework) + '</div>' +
            '<div class="h-ans">The answer: ' + esc(t.homeworkAnswer) + '</div>' +
            '<ol class="h-steps">' + t.method.map(function (m) { return '<li>' + esc(m) + '</li>'; }).join('') + '</ol></div>';
        });
      });
      h += '<button class="h-btn p big" onclick="HWClub.start(15)">Now practise these \u2014 15 minutes</button>' +
           '<button class="h-btn" onclick="HWClub.back()">Back to the list</button>';
      el('h-view').innerHTML = h;
    }
    function list_() { list(); }

    window.HWClub = {
      back: function () { list(); },
      toggle: function (id) {
        S.picked[id] = !S.picked[id];
        list();
      },
      start: function (mins) {
        var ids = Object.keys(S.picked).filter(function (k) { return S.picked[k]; });
        S.types = HW.typesFor(ids);
        S.pool = HW.pendingTeacher(ids);
        if (!S.types.length && !S.pool.length) {
          el('h-view').innerHTML = '<h1 class="h-h1">Nothing to practise yet</h1>' +
            '<div class="h-panel"><p class="h-q">The questions for the sheet you ticked are still being written. ' +
            'Tick one of the others and you can start straight away.</p>' +
            '<button class="h-btn p" onclick="HWClub.back()">Back to the assignments</button></div>';
          return;
        }
        S.view = 'run'; S.on = true; S.mode = 'mixed'; S.n = 0; S.right = 0;
        S.pool = HW.pendingTeacher(ids);
        el('hw-bar').className = 'hw-bar'; document.body.classList.remove('hw-bar-open');
        startClock(mins);
        nextQuestion();
      },
      /* Practice More is the only door to questions Gurukool wrote, and it
         stays shut until every question the teacher set has been attempted. */
      practiceMore: function (id) {
        var a = HW.assignments().filter(function (x) { return x.id === id; })[0];
        if (!a) return;
        var sheet = HW.teacher(a);
        if (sheet && HW.teacherProgress([id]).done < sheet.length) return;
        S.types = (a.types || []).slice();
        S.pool = [];                       /* generated only - the sheet is finished */
        if (!S.types.length) return;
        S.view = 'run'; S.on = true; S.mode = 'mixed'; S.n = 0; S.right = 0;
        el('hw-bar').className = 'hw-bar'; document.body.classList.remove('hw-bar-open');
        startClock(15);
        nextQuestion();
      },
      practiseOne: function (id) {
        var a = HW.assignments().filter(function (x) { return x.id === id; })[0];
        if (!a) return;
        S.types = (a.types || []).slice();
        S.pool = HW.pendingTeacher([id]);
        if (!S.types.length && !S.pool.length) { HWClub.start(15); return; }
        S.view = 'run'; S.on = true; S.mode = 'mixed'; S.n = 0; S.right = 0;
        el('hw-bar').className = 'hw-bar'; document.body.classList.remove('hw-bar-open');
        startClock(15);
        nextQuestion();
      },
      teach: function (id) { teachView([id]); },
      sheet: function (id) { sheetView(id); },
      /* get the sheet out of the device and into the parent's hands, so it can
         be sent to Gurukool. The share sheet first - it can save to Files, or
         send it on - and a plain download only if sharing is not offered. */
      /* Only ever offered on a sheet whose questions do not exist yet, so a
         child cannot delete the ones that work. */
      removeSheet: function (id) {
        var a = HW.assignments().filter(function (x) { return x.id === id; })[0] || {};
        if ((a.types || []).length) return;
        if (!window.confirm('Remove "' + (a.topic || 'this sheet') + '" and its file from this device?')) return;
        try { HW.removeAssignment(id); } catch (e) {}
        if (window.HWSheets && HWSheets.del) { try { HWSheets.del(id); } catch (e) {} }
        delete S.picked[id];
        list();
        var e = el('hw-add-msg');
        if (e) e.textContent = 'Removed. Add it again whenever you like.';
      },
      /* a sheet filed before the upload existed, or one that failed - send the
         copy on this device to the sources branch now */
      uploadStored: function (id) {
        var a = HW.assignments().filter(function (x) { return x.id === id; })[0] || {};
        var say = function (m) { var e = el('hw-add-msg'); if (e) e.textContent = m; };
        if (!window.HWSheets) { say('This device cannot send files.'); return; }
        say('Sending to Gurukool\u2026');
        HWSheets.get(id).then(function (rec) {
          if (!rec || !rec.blob) { say('The sheet is not on this device any more.'); return; }
          var file = new File([rec.blob], rec.name || 'homework-sheet', { type: rec.type || 'application/octet-stream' });
          var slug = String(a.topic || 'sheet').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
          var ext = (String(rec.name || '').match(/\.[a-z0-9]+$/i) || ['.jpg'])[0];
          return HWSheets.uploadSheet(file, (a.given || 'sheet') + '-' + slug + ext).then(function (res) {
            say('Sent to Gurukool (' + res.path + '). The questions will appear here once they are built.');
          });
        }).catch(function (e) {
          say('Could not send it: ' + (e && e.message ? e.message : 'unknown'));
        });
      },
      sendSheet: function (id) {
        if (!window.HWSheets) return;
        HWSheets.get(id).then(function (rec) {
          if (!rec || !rec.blob) return;
          var file = new File([rec.blob], rec.name || 'homework-sheet', { type: rec.type || 'application/octet-stream' });
          var say = function (m) { var e = el('hw-add-msg'); if (e) e.textContent = m; };
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            navigator.share({ files: [file], title: rec.name || 'Homework sheet' })
              .then(function () { say('Sent. Now attach it in your chat with Gurukool.'); })
              .catch(function () { /* the parent closed the share sheet - nothing to do */ });
            return;
          }
          try {
            var url = URL.createObjectURL(rec.blob);
            var a = document.createElement('a');
            a.href = url; a.download = rec.name || 'homework-sheet';
            document.body.appendChild(a); a.click(); a.remove();
            say('Saved to this device \u2014 attach that file in your chat with Gurukool.');
          } catch (e) { say('Could not open the sheet: ' + (e && e.message ? e.message : 'unknown')); }
        }).catch(function () {});
      },
      /* just the file. The date and a first guess at the topic come from its
         name; the questions are built from the sheet itself later. */
      addSheet: function (input) {
        var file = input && input.files && input.files[0];
        if (!file) return;
        var guess = HW.guessFromFile(file.name);
        var topic = guess.topic || ('Sheet of ' + HW.prettyDate(guess.given || ''));
        if (!guess.topic && !guess.given) topic = 'New sheet';
        var sig = HW.fileSignature(file);
        var already = HW.findDuplicate(topic, guess.given, sig);
        if (already) {
          el('hw-add-msg').textContent = 'That sheet is already here \u2014 it is the one dated ' +
            HW.prettyDate(already.given || guess.given) + '. Nothing added.';
          input.value = '';
          return;
        }
        var id = HW.addAssignment(topic, guess.given, sig);
        var say = function (m) { var e = el('hw-add-msg'); if (e) e.textContent = m; };
        /* show it at once - the file store can be slow, and the list must not wait */
        list();
        say('Filed as "' + topic + '". Sending it to Gurukool\u2026');
        input.value = '';
        if (window.HWSheets && HWSheets.uploadSheet) {
          var upName = (guess.given || 'sheet') + '-' + topic.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') +
            (/\.(pdf|jpe?g|png|heic)$/i.test(file.name) ? file.name.match(/\.[a-z0-9]+$/i)[0] : '.jpg');
          HWSheets.uploadSheet(file, upName).then(function (res) {
            say('Filed as "' + topic + '" and sent to Gurukool (' + res.path + '). The questions will appear here once they are built.');
          }).catch(function (e) {
            say('Filed as "' + topic + '". It could not be sent to Gurukool: ' + (e && e.message ? e.message : 'unknown'));
          });
        }
        if (window.HWSheets) {
          HWSheets.put(id, file).then(function () { return HWSheets.all(); }).then(function (m) {
            S.sheets = m || {};
            if (S.view === 'list') list();
          }).catch(function () {});
        }
      },
      teachPicked: function () {
        teachView(Object.keys(S.picked).filter(function (k) { return S.picked[k]; }));
      },
      how: function () {
        var t = HW.byId(S.q.typeId);
        if (!t || !t.method) {
          el('h-sol').innerHTML = '<div class="h-sol"><b>This one is from your sheet</b>' +
            '<p style="margin:8px 0 0">' + esc(S.q.sol || 'Read it again slowly and pick the answer that fits.') + '</p></div>';
          return;
        }
        el('h-sol').innerHTML = '<div class="h-sol"><b>How this type works</b><ol class="h-steps" style="margin:8px 0 0">' +
          t.method.map(function (m) { return '<li>' + esc(m) + '</li>'; }).join('') + '</ol>' +
          '<p style="margin:10px 0 0"><b>On your sheet:</b> ' + esc(t.homework) + ' \u2192 ' + esc(t.homeworkAnswer) + '</p></div>';
      },
      pick: function (i) {
        if (S.answered) return;
        var q = S.q, fb = el('h-fb'), btn = el('h-opt' + i);
        if (q.teacher) { try { HW.markTeacherDone(q.assignId, q.index); } catch (e) {} }
        var rec = load(), r = rec[q.typeId] = rec[q.typeId] || { n: 0, right: 0 };
        r.n++;
        if (i === q.answer) {
          S.answered = true; S.right++; r.right++; save(rec);
          btn.className = 'h-opt ok';
          if (window.Rhythm) Rhythm.note(true);
          if (window.OC && OC.record) { try { OC.record({ kind: 'homework', id: 'hw:' + q.typeId, correct: true, xp: 12, topic: q.typeId, timeSec: 0, targetSec: 0 }); } catch (e) {} }
          fb.className = 'h-fb ok'; fb.textContent = 'Correct.';
          el('h-sol').innerHTML = '<div class="h-sol"><b>Why</b><p style="margin:8px 0 0">' + esc(q.sol) + '</p>' +
            '<button class="h-btn p" style="margin-top:12px" onclick="HWClub.next()">Next question \u2192</button></div>';
        } else {
          S.answered = true; save(rec);
          btn.className = 'h-opt no'; btn.disabled = true;
          el('h-opt' + q.answer).className = 'h-opt ok';
          if (window.Rhythm) Rhythm.note(false);
          if (window.OC && OC.record) { try { OC.record({ kind: 'homework', id: 'hw:' + q.typeId, correct: false, xp: 0, topic: q.typeId, timeSec: 0, targetSec: 0 }); } catch (e) {} }
          fb.className = 'h-fb no';
          fb.textContent = 'Not this time. ' + (q.hints[0] || '');
          el('h-sol').innerHTML = '<div class="h-sol"><b>How it works</b><p style="margin:8px 0 0">' + esc(q.sol) + '</p>' +
            '<button class="h-btn p" style="margin-top:12px" onclick="HWClub.next()">Next question \u2192</button></div>';
        }
      },
      next: function () { nextQuestion(); },
      stop: function () { finish(); }
    };

    function finish() {
      stopClock();
      S.on = false;
      el('h-view').innerHTML = '<h1 class="h-h1">\ud83c\udfc6 Homework Club session done</h1>' +
        '<div class="h-panel"><p class="h-q">You answered ' + (S.n || 0) + ' question' + ((S.n || 0) === 1 ? '' : 's') +
        ' and got ' + S.right + ' right.</p>' +
        '<p class="h-lead">Every one of those came from the homework you ticked. If one kind still feels slippery, ' +
        'go back and tick just that one, or ask to be taught it.</p>' +
        '<button class="h-btn p" onclick="HWClub.back()">Back to the assignments</button></div>';
    }

    /* Anything filed twice is cleared out. A sheet whose questions have since
       been built is dropped too - and that one is worth a cheer, because the
       child was told to wait for it. */
    function isBuiltNow(a) {
      var hit = null;
      HW.assignments().forEach(function (b) {
        if (hit || !b.built) return;
        if (b.given && a.given && b.given === a.given &&
            String(b.topic || '').trim().toLowerCase() === String(a.topic || '').trim().toLowerCase()) hit = b;
      });
      return hit;
    }
    var removed = [];
    try { removed = HW.dedupe() || []; } catch (e) { removed = []; }
    var landed = removed.map(isBuiltNow).filter(Boolean);

    loadSheets(function () {
      list();
      var e = el('hw-add-msg');
      if (!e) return;
      if (landed.length) {
        e.textContent = '\ud83c\udf89 The questions are ready for ' +
          landed.map(function (b) { return b.topic; }).join(', ') + '. Tick it and go.';
      } else if (removed.length) {
        e.textContent = 'Tidied up ' + removed.length + ' duplicate sheet' + (removed.length === 1 ? '' : 's') + '.';
      }
    });


  })();
  </script>
</body>
</html>
