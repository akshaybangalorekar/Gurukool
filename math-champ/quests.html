<style>
  /* ---------- quest pages (Equation Forge) ---------- */
  .qq-wrap { max-width: 760px; margin: 0 auto; padding: 18px 14px 120px; }
  .qq-grid { display: grid; gap: 12px; }
  .qq-card, .qq-case { display: block; }
  .qq-card { display: flex; gap: 14px; align-items: center; background: var(--surface); border: 1.5px solid var(--border); border-radius: 16px; padding: 14px; cursor: pointer; transition: all .15s; }
  .qq-card:hover { transform: translateY(-2px); border-color: #66bb6a; box-shadow: 0 6px 16px rgba(46,125,50,.12); }
  .qq-card.locked { opacity: .55; cursor: not-allowed; }
  .qq-card.done { border-color: #9ccc65; background: linear-gradient(135deg, #f1f8e9, var(--surface)); }
  .qq-icon { font-size: 2rem; width: 54px; height: 54px; display: flex; align-items: center; justify-content: center; background: var(--bg-deep); border-radius: 14px; flex: none; }
  .qq-icon.big { font-size: 3rem; width: 84px; height: 84px; margin: 0 auto 10px; }
  .qq-body { flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .qq-body b { font-size: 1.06rem; }
  .qq-tech { color: var(--accent); font-weight: 700; font-size: 15.5px; }
  .qq-st { color: var(--ink-dim); font-size: 15px; font-weight: 700; }
  .qq-go { font-size: 1.5rem; color: var(--accent); font-weight: 900; }
  .qq-label { font-family: var(--font-display); font-weight: 800; margin: 20px 0 10px; font-size: 1.05rem; }
  .qq-techgrid { display: grid; gap: 10px; }
  .qq-tech-chip { display: flex; gap: 12px; align-items: center; background: var(--surface); border: 1.5px solid #9ccc65; border-radius: 14px; padding: 10px 14px; }
  .qq-tech-chip.off { border-style: dashed; border-color: var(--border-bright); opacity: .6; }
  .qq-tech-chip b { display: block; }
  .qq-tech-chip span { font-size: 14.5px; color: var(--ink-dim); line-height: 1.35; }
  .qq-techcard { background: linear-gradient(135deg, #f1f8e9, #fff); border: 2px solid #9ccc65; border-radius: 14px; padding: 14px; text-align: center; font-size: 1.05rem; }
  .qq-case { background: var(--surface); border: 1.5px solid var(--border); border-radius: 18px; padding: 18px; box-shadow: 0 3px 14px rgba(43,38,32,.06); }
  .qq-dotrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .qq-dot { width: 34px; height: 34px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 900; background: var(--bg-deep); color: var(--ink-dim); border: 2px solid var(--border); font-size: 15px; }
  .qq-dot.done { background: #c8e6c9; color: var(--green); }
  .qq-dot.cur { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
  .qq-name { font-weight: 800; color: var(--ink-dim); margin-left: auto; }
  .qq-ansrow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .qq-in { font-family: var(--font-display); font-size: 1.5rem; font-weight: 800; padding: 10px 14px; border-radius: 12px; border: 2px solid var(--border-bright); width: min(300px, 100%); background: #fff; color: var(--ink); }
  .qq-in:focus { outline: none; border-color: var(--accent); }
  .qq-opts { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 0; }
  .qq-opt { font-family: var(--font-body); font-size: 1rem; font-weight: 800; padding: 12px 16px; border-radius: 12px; border: 2px solid var(--border-bright); background: var(--surface-2); cursor: pointer; transition: all .12s; color: var(--ink); }
  .qq-opt:hover { border-color: var(--accent); }
  .qq-opt.sel { border-color: var(--accent); background: var(--accent-dim); box-shadow: 0 0 0 3px var(--accent-dim); }
  .qq-opt.used { opacity: .35; cursor: default; }
  .qq-clueq { font-weight: 800; margin: 14px 0 2px; color: #1b5e20; }
  .qq-slots { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
  .qq-slot { min-width: 64px; min-height: 46px; border: 2px dashed var(--border-bright); border-radius: 12px; display: flex; align-items: center; justify-content: center; padding: 6px 10px; font-weight: 800; color: var(--ink-dim); background: var(--bg-deep); text-align: center; }
  .qq-slot.full { border-style: solid; border-color: var(--accent); background: var(--accent-dim); color: var(--ink); }
  .qq-btn { font-family: var(--font-display); font-size: 1.1rem; font-weight: 800; padding: 12px 22px; border-radius: 14px; border: none; background: linear-gradient(135deg, #66bb6a, #2e7d32); color: #fff; cursor: pointer; box-shadow: 0 3px 0 #1b5e20; }
  .qq-btn:active { transform: translateY(2px); box-shadow: none; }
  .qq-btn.sec { background: var(--surface-2); color: var(--ink); border: 2px solid var(--border-bright); box-shadow: none; }
  .qq-btn.tiny { font-size: .92rem; padding: 8px 14px; }
  .qq-actions { margin-top: 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .qq-fb { border-radius: 12px; padding: 10px 14px; font-weight: 700; margin-top: 12px; }
  .qq-fb.info { background: var(--bg-deep); }
  .qq-fb.bad { background: #ffe0b2; color: #8a4b00; }
  .qq-fb.win { background: #c8e6c9; color: var(--green); }
  .qq-hint { background: #fff8e1; border-left: 5px solid var(--amber); padding: 10px 12px; border-radius: 8px; margin-top: 10px; font-weight: 600; }
  .qq-won { text-align: center; }
  .qq-won p { line-height: 1.55; background: #f1f8e9; border-radius: 12px; padding: 12px; font-weight: 600; }
  .qq-pad { border: 2px solid var(--border-bright); border-radius: 14px; background:
    repeating-linear-gradient(0deg, transparent 0 23px, rgba(43,38,32,.08) 23px 24px),
    repeating-linear-gradient(90deg, transparent 0 23px, rgba(43,38,32,.08) 23px 24px), #fff; max-width: 100%; touch-action: none; cursor: crosshair; }
  .qq-tabs { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 12px; }
  .qq-tab { font-family: var(--font-display); font-size: 1rem; font-weight: 800; padding: 10px 16px; border-radius: 12px; border: 2px solid var(--border-bright); background: var(--surface-2); color: var(--ink); cursor: pointer; }
  .qq-tab.on { border-color: #2e7d32; background: linear-gradient(135deg, #f1f8e9, #fffdf7); box-shadow: 0 0 0 3px var(--accent-dim); }
  .qq-setname { text-align: center; font-family: var(--font-display); font-size: 1.15rem; margin: 0 0 14px; }
  .qq-settag { color: var(--ink-dim); font-size: .95rem; font-weight: 700; }
  textarea { width: 100%; font-family: var(--font-body); font-size: 1rem; padding: 10px; border-radius: 12px; border: 2px solid var(--border-bright); }
</style>

<!-- ============ Kid Keypad: on-screen number pad (touch devices only) ============ -->
  <style>
    #kidpad { position: fixed; left: 0; right: 0; bottom: 0; z-index: 900; display: none;
      margin: 0 auto; padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
      background: rgba(43, 38, 32, 0.97); border-radius: 18px 18px 0 0;
      box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.3); }
    #kidpad.show { display: block; }
    #kidpad .kstatus { color: #faf5ea; font-size: 13px; text-align: center; min-height: 16px; margin: 0 0 4px; }
    #kidpad .kgrid { display: flex; flex-wrap: wrap; gap: 7px; }
    #kidpad button { flex: 1 1 54px; min-width: 48px; min-height: 52px; font-size: 25px; font-weight: 800; border: 0; border-radius: 12px;
      background: #faf5ea; color: #2b2620; font-family: inherit; cursor: pointer;
      touch-action: manipulation; user-select: none; -webkit-user-select: none; }
    #kidpad button:active { transform: translateY(2px); background: #f2d8a7; }
    #kidpad .kw { background: #e9e2d4; }
    #kidpad .kgo { background: #2a9d8f; color: #fff; font-size: 20px; letter-spacing: 0.4px; flex: 1.8 1 120px; }
    #kidpad .kmic { background: #e9e2d4; }
    #kidpad .kmic.listening { background: #ef5350; color: #fff; animation: kpulse 1s infinite; }
    @keyframes kpulse { 50% { opacity: 0.55; } }
  </style>
  <div id="kidpad" aria-hidden="true">
    <div class="kstatus" id="kpstatus"></div>
    <div class="kgrid">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button data-k="4">4</button><button data-k="5">5</button>
      <button data-k="6">6</button><button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button data-k="0">0</button>
      <button data-k="." class="kw">.</button><button data-k="-" class="kw">&minus;</button><button data-k="+" class="kw">+</button><button data-k="back" class="kw" aria-label="Backspace">⌫</button>
      <button data-k="mic" class="kmic" aria-label="Speak your answer">🎤</button><button data-k="go" class="kgo">GO ✓</button>
    </div>
  </div>
  <script>
  (function () {
    var INPUT_SEL = '#qq-in';
    var GO_ID = 'qq-go';
    var pad = document.getElementById('kidpad'), target = null;
    var coarse = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
    if (!pad || !coarse) { if (pad) pad.remove(); return; }

    var inp = document.querySelector(INPUT_SEL);
    if (inp) {
      inp.setAttribute('type', 'text');
      inp.setAttribute('inputmode', 'none');
    }

    document.addEventListener('focusin', function (e) {
      var t = e.target;
      if (t && t.matches && t.matches(INPUT_SEL)) {
        target = t; pad.classList.add('show'); pad.setAttribute('aria-hidden', 'false');
        setTimeout(function () { try { t.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (err) {} }, 60);
      } else if (!(t && t.closest && t.closest('#kidpad'))) {
        target = null; pad.classList.remove('show'); pad.setAttribute('aria-hidden', 'true');
      }
    });

    function caret(t) {
      try { var s = t.selectionStart; if (typeof s === 'number') return s; } catch (err) {}
      return t.value.length;
    }

    pad.addEventListener('pointerdown', function (e) {
      var b = e.target.closest ? e.target.closest('button') : null;
      if (!b) return;
      e.preventDefault();
      if (!target) target = document.querySelector(INPUT_SEL);
      if (!target) return;
      var k = b.getAttribute('data-k'), v = target.value;
      if (k === 'mic') { toggleMic(); return; }
      if (k === 'back') {
        target.value = v.slice(0, Math.max(0, caret(target) - 1)) + v.slice(caret(target) + ((v.length > caret(target)) ? 1 : 0));
      } else if (k === 'go') {
        var go = document.getElementById(GO_ID);
        if (go) go.click();
        return;
      } else if (k === '-') {
        target.value = (v.charAt(0) === '-') ? v.slice(1) : (v === '' ? '-' : '-' + v);
      } else if (k === '.') {
        if (v.indexOf('.') === -1) target.value = (v === '' || v === '-') ? v + '0.' : v + '.';
      } else {
        var c = caret(target);
        target.value = v.slice(0, c) + k + v.slice(c);
      }
      target.dispatchEvent(new Event('input', { bubbles: true }));
    });

    /* ---- 🎤 voice-to-math: speak numbers and equations, get digits ---- */
    var kstatus = document.getElementById('kpstatus'), statTimer = null;
    function status(msg) {
      if (!kstatus) return;
      kstatus.textContent = msg || '';
      if (statTimer) clearTimeout(statTimer);
      if (msg) statTimer = setTimeout(function () { kstatus.textContent = ''; }, 5000);
    }
    function insertText(str) {
      if (!target) target = document.querySelector(INPUT_SEL);
      if (!target) return;
      var c = caret(target);
      target.value = target.value.slice(0, c) + str + target.value.slice(c);
      target.dispatchEvent(new Event('input', { bubbles: true }));
    }
    var UN = { zero: 0, one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9,
      ten: 10, eleven: 11, twelve: 12, thirteen: 13, fourteen: 14, fifteen: 15, sixteen: 16, seventeen: 17,
      eighteen: 18, nineteen: 19, twenty: 20, thirty: 30, forty: 40, fourty: 40, fifty: 50, sixty: 60,
      seventy: 70, eighty: 80, ninety: 90 };
    var SC = { hundred: 100, thousand: 1000, lakh: 100000, lakhs: 100000, crore: 10000000, crores: 10000000 };
    var OPS = { 'plus': '+', 'add': '+', 'minus': '-', 'negative': '-', 'times': '\u00D7',
      'multiply': '\u00D7', 'divide': '\u00F7', 'over': '\u00F7' };
    function voiceToMath(text) {
      var s = ' ' + String(text).toLowerCase() + ' ';
      s = s.replace(/multiplied by/g, ' times ').replace(/divided by/g, ' divide ')
           .replace(/equals|equal to|is equal/g, ' = ')
           .replace(/rupees|rupee|rs\.?|percent|percentage|answer|only/g, ' ');
      var toks = s.replace(/[^a-z0-9.+= ]/g, ' ').split(/\s+/).filter(Boolean);
      var out = '', total = 0, cur = null, dec = '', inDec = false, lastUnit = false, lastTens = false;
      function flush() {
        if (cur !== null || dec !== '' || total) {
          out += (total + (cur === null ? 0 : cur)) + (dec ? '.' + dec : '');
        }
        total = 0; cur = null; dec = ''; inDec = false;
      }
      for (var i = 0; i < toks.length; i++) {
        var t = toks[i];
        if (t === '.' || t === 'point' || t === 'dot') { inDec = true; continue; }
        if (OPS[t] || t === '=') { flush(); out += (t === '=' ? '=' : OPS[t]); continue; }
        if (t === 'and') { continue; }
        if (/^\d+$/.test(t)) {
          if (inDec) { dec += t; }
          else if (cur === null) { cur = parseInt(t, 10); lastUnit = true; }
          else { cur = parseInt(String(cur) + t, 10); }
          continue;
        }
        if (t in UN) {
          var uv = UN[t];
          if (inDec) { dec += uv; }
          else if (uv < 10 && lastUnit && cur !== null) { cur = cur * 10 + uv; }
          else if (uv < 10 && lastTens && cur !== null) { cur = cur + uv; }
          else { cur = (cur === null ? 0 : cur) + uv; }
          lastUnit = uv < 10; lastTens = uv >= 20;
          continue;
        }
        if (t in SC) {
          var sv = SC[t];
          if (sv === 100) { cur = (cur === null ? 1 : cur) * 100; }
          else { cur = (cur === null ? 1 : cur) * sv; total += cur; cur = null; }
          lastUnit = false; lastTens = false;
          continue;
        }
      }
      flush();
      return out.replace(/^\s+/, '');
    }
    window.voiceToMath = voiceToMath;
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    var rec = null, listening = false;
    var micBtn = pad.querySelector('[data-k="mic"]');
    function toggleMic() {
      if (!SR) { status('\uD83C\uDF99\uFE0F Voice needs internet (Safari)'); return; }
      if (listening && rec) { try { rec.stop(); } catch (e) {} return; }
      rec = new SR();
      rec.lang = 'en-IN';
      rec.interimResults = false;
      rec.maxAlternatives = 1;
      rec.onstart = function () { listening = true; if (micBtn) micBtn.classList.add('listening'); status('\uD83C\uDF99\uFE0F Listening\u2026 speak now'); };
      rec.onresult = function (e) {
        var tr = e.results[0][0].transcript;
        var m = voiceToMath(tr);
        status('\uD83C\uDF99\uFE0F Heard: ' + (m || tr));
        if (m) insertText(m);
      };
      rec.onerror = function (e) { status(e.error === 'not-allowed' ? '\uD83C\uDF99\uFE0F Allow the microphone first' : '\uD83C\uDF99\uFE0F ' + (e.error || 'failed')); };
      rec.onend = function () { listening = false; if (micBtn) micBtn.classList.remove('listening'); };
      try { rec.start(); } catch (err) { status('\uD83C\uDF99\uFE0F ' + (err && err.message ? err.message : 'failed')); }
    }
  })();
  </script>
