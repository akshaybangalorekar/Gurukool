<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="../icon.png" type="image/png">
<link rel="apple-touch-icon" href="../icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="../manifest.json">
<meta name="apple-mobile-web-app-title" content="Gurukool">
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Math-Champ — Learn a new trick</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=40">
<style>
  .l-wrap{max-width:840px;margin:0 auto;padding:26px 22px 70px}
  .l-h1{font-family:Baloo 2,Nunito,sans-serif;font-weight:800;font-size:32px;color:#0f172a;margin:4px 0 6px}
  .l-lead{color:#64748b;font-size:17px;line-height:1.6;margin:0 0 20px}
  .l-grid{display:grid;grid-template-columns:1fr;gap:14px}
  @media(min-width:700px){.l-grid{grid-template-columns:repeat(2,1fr)}}
  .l-card{display:block;text-decoration:none;background:#fff;border:1px solid #e6ebf1;border-radius:18px;padding:18px;box-shadow:0 2px 10px rgba(15,23,42,.04)}
  .l-card:hover{box-shadow:0 10px 26px rgba(15,23,42,.09)}
  .l-card .ico{font-size:24px}
  .l-card b{display:block;font:800 20px/1.2 Nunito,system-ui,sans-serif;color:#0f172a;margin-top:6px}
  .l-card .sub{display:block;color:#64748b;font-size:15.5px;line-height:1.5;margin-top:4px}
  .l-lv{display:inline-block;margin-top:10px;font:800 13.5px Nunito,system-ui,sans-serif;border-radius:999px;padding:4px 11px;background:#f1f5f9;color:#475569}
  .l-lv.l1{background:#fef3c7;color:#92400e} .l-lv.l2{background:#dbeafe;color:#1e40af} .l-lv.l3{background:#dcfce7;color:#166534}
  .l-bar{height:6px;border-radius:999px;background:#e2e8f0;overflow:hidden;margin-top:10px}
  .l-bar div{height:100%;background:#2a9d8f;width:0}
  .l-sec{font:800 20px Nunito,system-ui,sans-serif;color:#0f172a;margin:26px 0 10px}
</style>
</head>
<body>
  <header class="topnav" id="topnav"></header>
  <main class="l-wrap"><div id="l-view"></div></main>
  <script src="../version.js?v=40"></script>
  <script src="../gk-fresh.js?v=40"></script>
  <script src="../rhythm.js?v=40"></script>
  <script src="assets/app.js?v=40"></script>
  <script src="assets/gen.js?v=40"></script>
  <script src="assets/teach.js?v=40"></script>
  <script src="assets/levels.js?v=40"></script>
  <script src="../champ-rail.js?v=40"></script>
  <script src="assets/nav.js?v=40"></script>
  <script>
    MathNav.mount('learn'); MathNav.top();
    var S = OC.STATE;
    function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
    var cards = Teach.lessons.map(function (l) {
      var lv = Levels.of(S, l.key), st = Levels.statsFor(S, l.key);
      var g = Gen.byKey(l.key);
      return '<a class="l-card" href="teach.html#' + l.key + '">' +
        '<span class="ico">' + l.icon + '</span><b>' + esc(l.name) + '</b>' +
        '<span class="sub">' + esc((l.what || '').split('.')[0]) + '.</span>' +
        '<span class="l-lv l' + lv + '">' + (lv ? 'Level ' + lv + ' \u00b7 ' + Levels.label(lv) : 'Not started') + (st.n ? ' \u00b7 ' + st.n + ' questions' : '') + '</span>' +
        '<span class="l-bar"><span style="width:' + Math.round(100 * lv / 3) + '%"></span></span>' +
        '</a>';
    }).join('');
    document.getElementById('l-view').innerHTML =
      '<h1 class="l-h1">Learn a new trick</h1>' +
      '<p class="l-lead">Pick one idea. I will teach it to you a piece at a time, then give you questions that get harder as you get better \u2014 so you never have to choose between learning and practising.</p>' +
      '<div class="l-grid">' + cards + '</div>' +
      '<p class="l-sec">Or practise everything</p>' +
      '<div class="l-grid">' +
        '<a class="l-card" href="test.html"><span class="ico">\ud83c\udfaf</span><b>Test me today</b><span class="sub">Ten mixed questions on things you have met. Just for you.</span></a>' +
        '<a class="l-card" href="word-problems.html"><span class="ico">\ud83d\udcdd</span><b>Word problems</b><span class="sub">Fourteen story problems, from warm-up to Olympian.</span></a>' +
        '<a class="l-card" href="mission.html"><span class="ico">\ud83c\udfaf</span><b>Training mission</b><span class="sub">A timed mission that watches how you answer and picks the next question for you.</span></a>' +
        '<a class="l-card" href="toolbox.html"><span class="ico">\ud83e\uddf0</span><b>Toolbox</b><span class="sub">The formulas and tricks, all in one place.</span></a>' +
      '</div>';
</script>
  <script src="../kidpad.js?v=60"></script>
</body>
</html>
