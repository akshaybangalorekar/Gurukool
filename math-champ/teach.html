<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="../icon.png" type="image/png">
<link rel="apple-touch-icon" href="../icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="../manifest.json">
<meta name="apple-mobile-web-app-title" content="Gurukool">
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Math-Champ — Teach me a topic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=39">
<style>
  body { padding-bottom: env(safe-area-inset-bottom); }
  .t-wrap { max-width: 780px; margin: 0 auto; padding: 26px 22px 70px; }
  .t-h1 { font-family: Baloo 2, Nunito, sans-serif; font-weight: 800; font-size: 31px; color: #0f172a; margin: 4px 0 6px; }
  .t-lead { color: #64748b; font-size: 17px; line-height: 1.6; margin: 0 0 20px; }
  .t-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
  .t-card { text-align: left; background: #fff; border: 1px solid #e6ebf1; border-radius: 18px; padding: 18px; cursor: pointer; font-family: Nunito, system-ui, sans-serif; box-shadow: 0 2px 10px rgba(15,23,42,.04); }
  .t-card:hover { box-shadow: 0 10px 26px rgba(15,23,42,.09); }
  .t-card__ico { font-size: 24px; }
  .t-card b { display: block; font: 800 20px/1.2 Nunito, system-ui, sans-serif; color: #0f172a; margin-top: 6px; }
  .t-card span { display: block; color: #64748b; font-size: 15.5px; line-height: 1.5; margin-top: 4px; }
  .t-done { display: inline-block; margin-top: 10px; font-size: 13.5px; font-weight: 800; color: #047857; background: #ecfdf5; border-radius: 999px; padding: 3px 10px; }
  .t-panel { background: #fff; border: 1px solid #e6ebf1; border-radius: 20px; padding: 22px; margin-top: 16px; }
  .t-dots { display: flex; gap: 6px; margin-bottom: 14px; }
  .t-dot { width: 26px; height: 6px; border-radius: 999px; background: #e2e8f0; }
  .t-dot.on { background: #2a9d8f; }
  .t-say { background: #f8fafc; border-left: 4px solid #94a3b8; border-radius: 10px; padding: 14px 16px; font-size: 18px; line-height: 1.7; color: #1f2937; }
  .t-ask { font: 800 19.5px/1.5 Nunito, system-ui, sans-serif; color: #0f172a; margin: 16px 0 10px; }
  .t-in { font: 800 20px Space Mono, ui-monospace, monospace; padding: 11px 13px; border: 2px solid #cbd5e1; border-radius: 12px; width: 150px; }
  .t-btn { font: 800 16.5px Nunito, system-ui, sans-serif; padding: 12px 18px; border-radius: 13px; border: 2px solid #cbd5e1; background: #fff; color: #334155; cursor: pointer; margin: 4px 6px 4px 0; }
  .t-btn.p { background: #2a9d8f; border-color: #2a9d8f; color: #fff; }
  .t-fb { font: 700 17px Nunito, system-ui, sans-serif; margin: 12px 0 0; min-height: 24px; }
  .t-fb.ok { color: #047857; } .t-fb.no { color: #b45309; }
  .t-know { background: #fffbeb; border: 1px solid #fcd34d; border-radius: 12px; padding: 12px 16px; margin: 12px 0; }
  .t-know li { font-size: 17px; line-height: 1.6; }
  .t-sol { background: #f5f3ff; border: 1px solid #c4b5fd; border-radius: 12px; padding: 14px 16px; margin-top: 12px; font-size: 17px; line-height: 1.7; }
  .t-meta { color: #94a3b8; font-size: 15px; margin-top: 14px; }
</style>
</head>
<body>
  <div id="gk-head"></div>
  <main class="t-wrap">
    <div id="t-view"></div>
  </main>
  <script src="../version.js?v=39"></script>
  <script src="../gk-fresh.js?v=39"></script>
  <script src="../rhythm.js?v=39"></script>
  <script src="assets/app.js?v=39"></script>
  <script src="assets/gen.js?v=39"></script>
  <script src="assets/teach.js?v=39"></script>
  <script src="assets/levels.js?v=39"></script>
  <script src="../champ-rail.js?v=39"></script>
  <script src="assets/nav.js?v=39"></script>
  <script>
  (function () {
    var S = OC.STATE;
    function el(id) { return document.getElementById(id); }
    function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    function fracVal(v) { var m = String(v).trim().match(/^(-?\d+)\s*\/\s*(\d+)$/); return m ? (+m[1]) / (+m[2]) : null; }
    function norm(v) { return String(v == null ? '' : v).trim().toLowerCase().replace(/\s+/g, ' '); }
    function matches(g, w) {
      var a = norm(g), b = norm(w); if (!a) return false; if (a === b) return true;
      var av = fracVal(a), bv = fracVal(b), an = parseFloat(a.replace(/[^0-9.\-]/g, '')), bn = parseFloat(b.replace(/[^0-9.\-]/g, ''));
      var x = (av !== null) ? av : (isNaN(an) ? null : an), y = (bv !== null) ? bv : (isNaN(bn) ? null : bn);
      return (x !== null && y !== null && Math.abs(x - y) < 1e-9);
    }
    function practiseOf(key) { var p = S.practice || {}; return p['teach:' + key] || null; }
    function renderHead() {
      ChampRail.top({ title: 'Math-Champ', icon: '⚡', el: 'gk-head', hub: '../index.html', sync: OC.forceSync,
        info: function () { return { name: (S.name || '').trim(), level: OC.levelOf(S.xp).name, xp: S.xp, streak: (S.streak && S.streak.count) || 0 }; } });
    }
    MathNav.mount('learn');
    renderHead();

    var L = null, step = 0, practise = null, pIndex = 0, pTries = 0, pQueue = [];

    function topicList() {
      var cards = Teach.lessons.map(function (l) {
        var pr = practiseOf(l.key);
        return '<button class="t-card" onclick="T.open(\'' + l.key + '\')">' +
          '<span class="t-card__ico">' + l.icon + '</span><b>' + esc(l.name) + '</b><span>' + esc(l.what.split('.')[0]) + '.</span>' +
          (pr ? '<span class="t-done">✅ learned · ' + (pr.done || 0) + ' questions practised</span>' : '') + '</button>';
      }).join('');
      el('t-view').innerHTML = '<h1 class="t-h1">Teach me a topic</h1>' +
        '<p class="t-lead">Pick something to learn. I will explain it a piece at a time and ask you a small question after each piece — then you practise it with fresh questions that never repeat.</p>' +
        '<div class="t-grid">' + cards + '</div>';
    }

    function renderLesson() {
      var st = L.steps[step];
      var dots = L.steps.map(function (s, i) { return '<span class="t-dot' + (i <= step ? ' on' : '') + '"></span>'; }).join('');
      el('t-view').innerHTML = '<button class="t-btn" onclick="T.topics()">‹ All topics</button>' +
        '<h1 class="t-h1">' + L.icon + ' ' + esc(L.name) + '</h1>' +
        '<div class="t-panel"><div class="t-dots">' + dots + '</div>' +
        '<div class="t-say">' + esc(st.say) + '</div>' +
        '<p class="t-ask">' + esc(st.ask) + '</p>' +
        '<input class="t-in" id="t-in" inputmode="text" autocomplete="off" placeholder="answer"> ' +
        '<button class="t-btn p" onclick="T.checkStep()">Check</button>' +
        '<p class="t-fb" id="t-fb"></p></div>';
      var i = el('t-in');
      i.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); T.checkStep(); } });
      i.focus();
    }

    function renderPractise() {
      if (pIndex >= pQueue.length) {
        var pr = practiseOf(L.key) || { done: 0 };
        pr.done = (pr.done || 0) + pQueue.length; pr.at = Date.now();
        S.practice = S.practice || {}; S.practice['teach:' + L.key] = pr; OC.save();
        var right = pQueue.filter(function (x) { return x.got; }).length;
        el('t-view').innerHTML = '<h1 class="t-h1">Lesson done — ' + esc(L.name) + ' ✅</h1>' +
          '<div class="t-panel"><p class="t-say">You answered ' + right + ' of ' + pQueue.length + ' practice questions on the first go. ' +
          (right === pQueue.length ? 'That is the technique working.' : 'Have another round whenever you like — the questions are always new.') + '</p>' +
          '<button class="t-btn p" onclick="T.practiseAgain()">Practise more</button>' +
          '<button class="t-btn" onclick="T.topics()">Back to topics</button></div>';
        renderHead();
        return;
      }
      var q = pQueue[pIndex];
      el('t-view').innerHTML = '<div class="t-panel">' +
        '<div class="t-meta">Question ' + (pIndex + 1) + ' of ' + pQueue.length + ' · ' + esc(L.name) + '</div>' +
        '<p class="t-ask">' + esc(q.q) + '</p>' + (q.art ? q.art : '') +
        '<input class="t-in" id="t-in" inputmode="text" autocomplete="off" placeholder="answer"> ' +
        '<button class="t-btn p" onclick="T.checkP()">Check</button>' +
        '<button class="t-btn" id="t-know-btn" onclick="T.know()">What do we know?</button>' +
        '<p class="t-fb" id="t-fb"></p><div id="t-know"></div><div id="t-sol"></div></div>';
      var i = el('t-in');
      i.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); T.checkP(); } });
      i.focus();
    }

    window.T = {
      topics: function () { L = null; practise = null; topicList(); },
      open: function (key) {
        L = Teach.byKey(key); if (!L) return; step = 0; practise = null; renderLesson();
      },
      checkStep: function () {
        var st = L.steps[step], v = el('t-in').value, fb = el('t-fb');
        if (!norm(v)) { fb.className = 't-fb no'; fb.textContent = 'Have a go — a guess is fine.'; return; }
        if (matches(v, st.ans)) {
          fb.className = 't-fb ok'; fb.innerHTML = 'Yes. ✅';
          step++;
          if (window.Rhythm) Rhythm.note(true);
          setTimeout(function () { if (step < L.steps.length) renderLesson(); else T.startPractise(); }, 650);
        } else {
          fb.className = 't-fb no'; fb.textContent = 'Not yet. ' + st.hint;
          el('t-in').value = ''; el('t-in').focus();
          if (window.Rhythm) Rhythm.note(false);
        }
      },
      startPractise: function () {
        pQueue = [];
        /* the questions rise with his level on this topic - practice and
           learning are the same choice, never two separate ones */
        var lv = Levels.of(S, L.key);
        Levels.tiers(lv).forEach(function (tier) {
          var q = Gen.make(L.key, tier); q.got = false; pQueue.push(q);
        });
        pIndex = 0;
        el('t-view').innerHTML = '<div class="t-panel"><h1 class="t-h1" style="font-size:26px">Now try it</h1>' +
          '<p class="t-lead">Six fresh questions on ' + esc(L.name) + '. They are new every time, so you cannot memorise them — you have to use the idea.</p>' +
          '<button class="t-btn p" onclick="T.begin()">Start</button></div>';
      },
      begin: function () { renderPractise(); },
      know: function () {
        var q = pQueue[pIndex];
        el('t-know').innerHTML = '<div class="t-know"><b>What we know:</b><ul>' + q.know.map(function (k) { return '<li>' + esc(k) + '</li>'; }).join('') + '</ul></div>';
        el('t-know-btn').disabled = true;
      },
      checkP: function () {
        var q = pQueue[pIndex], v = el('t-in').value, fb = el('t-fb');
        if (!norm(v)) { fb.className = 't-fb no'; fb.textContent = 'Type your answer first.'; return; }
        if (matches(v, q.ans)) {
          q.got = true;
          var xp = pTries === 0 ? 12 : 6;
          OC.record({ kind: 'teach', id: 'teach:' + L.key, correct: true, xp: xp, timeSec: 0, targetSec: 0 });
          fb.className = 't-fb ok'; fb.innerHTML = 'Correct. +' + xp + ' XP';
          if (window.Rhythm) Rhythm.note(true);
          pTries = 0; pIndex++;
          setTimeout(renderPractise, 700);
          return;
        }
        pTries++;
        if (window.Rhythm) Rhythm.note(false);
        fb.className = 't-fb no';
        if (pTries === 1) { fb.textContent = 'Not yet. ' + q.hints[0]; }
        else if (pTries === 2) { fb.textContent = 'Try this: ' + q.hints[1]; }
        else {
          fb.textContent = 'Let us look at it together.';
          el('t-sol').innerHTML = '<div class="t-sol"><b>How it works</b><p style="margin:8px 0 0">' + esc(q.sol) + '</p></div>';
        }
        OC.record({ kind: 'teach', id: 'teach:' + L.key, correct: false, xp: 0, timeSec: 0, targetSec: 0 });
      },
      practiseAgain: function () { T.startPractise(); }
    };

    /* deep link: teach.html#frac */
    var hash = (location.hash || '').replace('#', '');
    if (hash && Teach.byKey(hash)) T.open(hash); else topicList();
  })();
  </script>
</body>
</html>
