<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="../icon.png" type="image/png">
<link rel="apple-touch-icon" href="../icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="../manifest.json">
<meta name="apple-mobile-web-app-title" content="Gurukool">
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Mind-Champ — Build something real</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
<style>
  body { padding-bottom: env(safe-area-inset-bottom); }
  .l-wrap { max-width: 840px; margin: 0 auto; padding: 26px 22px 70px; }
  .l-h1 { font-family: Baloo 2, Nunito, sans-serif; font-weight: 800; font-size: 32px; color: #0f172a; margin: 4px 0 6px; }
  .l-lead { color: #64748b; font-size: 17px; line-height: 1.6; margin: 0 0 20px; }
  .l-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
  @media (min-width: 700px) { .l-grid { grid-template-columns: repeat(2, 1fr); } }
  .l-card { display: block; text-decoration: none; background: #fff; border: 1px solid #e6ebf1; border-radius: 18px; padding: 18px; box-shadow: 0 2px 10px rgba(15,23,42,.04); }
  .l-card .ico { font-size: 24px; }
  .l-card b { display: block; font: 800 20px/1.2 Nunito, system-ui, sans-serif; color: #0f172a; margin-top: 6px; }
  .l-card .sub { display: block; color: #64748b; font-size: 15.5px; line-height: 1.5; margin-top: 4px; }
  .l-lv { display: inline-block; margin: 10px 6px 0 0; font: 800 13.5px Nunito, system-ui, sans-serif; border-radius: 999px; padding: 4px 11px; background: #f1f5f9; color: #475569; }
  .r-say { background: #f8fafc; border-left: 4px solid #7c3aed; border-radius: 10px; padding: 14px 16px; font-size: 18px; line-height: 1.7; color: #1f2937; }
  .r-ask { font: 800 19.5px/1.5 Nunito, system-ui, sans-serif; color: #0f172a; margin: 16px 0 10px; }
  .r-in { font: 800 20px Space Mono, ui-monospace, monospace; padding: 11px 13px; border: 2px solid #cbd5e1; border-radius: 12px; width: 200px; }
  .r-btn { font: 800 16.5px Nunito, system-ui, sans-serif; padding: 12px 18px; border-radius: 13px; border: 2px solid #cbd5e1; background: #fff; color: #334155; cursor: pointer; margin: 4px 6px 4px 0; }
  .r-btn.p { background: #7c3aed; border-color: #7c3aed; color: #fff; }
  .r-fb { font: 700 17px Nunito, system-ui, sans-serif; margin: 12px 0 0; min-height: 24px; }
  .r-fb.ok { color: #047857; } .r-fb.no { color: #b45309; }
  .r-know { background: #fffbeb; border: 1px solid #fcd34d; border-radius: 12px; padding: 12px 16px; margin: 12px 0; }
  .r-sol { background: #f5f3ff; border: 1px solid #c4b5fd; border-radius: 12px; padding: 14px 16px; margin-top: 12px; font-size: 17px; line-height: 1.7; }
  .r-dots { display: flex; gap: 6px; margin-bottom: 14px; }
  .r-dot { width: 30px; height: 6px; border-radius: 999px; background: #e2e8f0; }
  .r-dot.on { background: #7c3aed; }
  .r-st { font: 800 20px Nunito, system-ui, sans-serif; color: #0f172a; margin: 0 0 12px; }
</style>
</head>
<body>
  <header class="topnav" id="gk-head"></header>
  <main class="l-wrap"><div id="m-view"></div></main>
  <script src="../version.js?v=47"></script>
  <script src="../gk-fresh.js?v=47"></script>
  <script src="assets/projects.js?v=47"></script>
  <script src="../champ-rail.js?v=47"></script>
  <script src="assets/nav.js?v=47"></script>
  <script>
  (function () {
    var KEY = 'gk_mprojects';
    function load() { try { return JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { return {}; } }
    function save(o) { try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) {} }
    function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    function norm(v) { return String(v == null ? '' : v).trim().toLowerCase().replace(/[.,!?]/g, '').replace(/\s+/g, ' '); }
    function numOf(v) { var m = norm(v).match(/-?\d+(\.\d+)?/); return m ? parseFloat(m[0]) : null; }
    function matches(give, want) {
      var a = norm(give), b = norm(want);
      if (!a) return false;
      if (a === b) return true;
      var x = numOf(a), y = numOf(b);
      if (x !== null && y !== null && Math.abs(x - y) < 1e-9) return true;
      /* "ravi and meera" in any order */
      var bw = b.split(/ and | & /), okAll = bw.length > 1;
      if (okAll) { for (var i = 0; i < bw.length; i++) if (a.indexOf(bw[i]) < 0) okAll = false; }
      return okAll;
    }

    var rec = load();
    var view = { page: 'list' }, cur = null, stepI = 0, tries = 0;

    function listHTML() {
      var cards = MindProjects.list.map(function (p) {
        var done = rec[p.key] && rec[p.key].done;
        return '<div class="l-card"><span class="ico">' + p.icon + '</span><b>' + esc(p.title) + '</b>' +
          '<span class="sub">' + esc(p.hook) + '</span>' +
          '<span class="l-lv">needs: ' + esc((p.needs || []).join(', ')) + '</span>' +
          (done ? '<span class="l-lv" style="background:#dcfce7;color:#166534">\u2713 finished</span>' : '<span class="l-lv">' + p.steps.length + ' steps</span>') +
          '<div style="margin-top:10px"><button class="r-btn p" onclick="MP.open(\'' + p.key + '\')">Open the project</button></div></div>';
      }).join('');
      return '<h1 class="l-h1">\ud83d\ude80 Build something real</h1>' +
        '<p class="l-lead">Logic you can use on a real problem. Each one is a genuine puzzle from the world, not a textbook exercise, and each one ends with you producing a plan that works. Every step shows you the move, then asks you one question about this problem.</p>' +
        '<div class="l-grid">' + cards + '</div>';
    }

    function projHTML() {
      var p = cur, st = p.steps[stepI];
      var dots = p.steps.map(function (s, i) { return '<span class="r-dot' + (i <= stepI ? ' on' : '') + '"></span>'; }).join('');
      return '<button class="r-btn" onclick="MP.back()">\u2039 All projects</button>' +
        '<h1 class="l-h1" style="margin-top:12px">' + p.icon + ' ' + esc(p.title) + '</h1>' +
        '<div class="r-dots">' + dots + '</div>' +
        '<p class="r-st">Step ' + (stepI + 1) + ' of ' + p.steps.length + ' \u00b7 ' + esc(st.title) + '</p>' +
        '<div class="r-say">' + esc(st.say) + '</div>' +
        '<p class="r-ask">' + esc(st.ask) + '</p>' +
        '<input class="r-in" id="m-in" autocomplete="off" placeholder="your answer"> ' +
        '<button class="r-btn p" onclick="MP.check()">Check</button>' +
        '<button class="r-btn" id="m-know-btn" onclick="MP.know()">What do we know?</button>' +
        '<p class="r-fb" id="m-fb"></p><div id="m-know"></div><div id="m-sol"></div>';
    }

    function render() {
      document.getElementById('m-view').innerHTML = (view.page === 'list') ? listHTML() : projHTML();
      var inp = document.getElementById('m-in');
      if (inp) { inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); MP.check(); } }); inp.focus(); }
      window.scrollTo(0, 0);
    }

    window.MP = {
      open: function (key) {
        cur = MindProjects.byKey(key); if (!cur) return;
        stepI = 0; tries = 0; view = { page: 'proj' }; render();
      },
      back: function () { view = { page: 'list' }; render(); },
      know: function () {
        var st = cur.steps[stepI];
        document.getElementById('m-know').innerHTML = '<div class="r-know"><b>What we know:</b><ul><li>' + esc(st.hint) + '</li></ul></div>';
        document.getElementById('m-know-btn').disabled = true;
      },
      check: function () {
        var st = cur.steps[stepI], fb = document.getElementById('m-fb'), v = document.getElementById('m-in').value;
        if (!norm(v)) { fb.className = 'r-fb no'; fb.textContent = 'Type your answer first — a guess is fine.'; return; }
        if (matches(v, st.ans)) {
          fb.className = 'r-fb ok'; fb.textContent = 'Correct — that is the move.';
          if (window.Rhythm) Rhythm.note(true);
          document.getElementById('m-sol').innerHTML = '<div class="r-sol"><b>Why</b><p style="margin:8px 0 0">' + esc(st.sol) + '</p>' +
            '<button class="r-btn p" style="margin-top:12px" onclick="MP.next()">' + (stepI + 1 >= cur.steps.length ? 'Finish the project' : 'Next step \u2192') + '</button></div>';
          return;
        }
        tries++;
        if (window.Rhythm) Rhythm.note(false);
        fb.className = 'r-fb no';
        if (tries === 1) fb.textContent = 'Not yet. ' + st.hint;
        else {
          fb.textContent = 'Let us work it through — then carry on.';
          document.getElementById('m-sol').innerHTML = '<div class="r-sol"><b>Why</b><p style="margin:8px 0 0">' + esc(st.sol) + '</p>' +
            '<button class="r-btn p" style="margin-top:12px" onclick="MP.next()">Carry on</button></div>';
        }
      },
      next: function () {
        stepI++; tries = 0;
        if (stepI >= cur.steps.length) {
          rec[cur.key] = { done: true, at: Date.now() }; save(rec);
          document.getElementById('m-view').innerHTML = '<h1 class="l-h1">\ud83c\udfc6 Project finished</h1>' +
            '<div class="r-sol"><b>' + esc(cur.title) + '</b><p style="margin:8px 0 0">You worked that out step by step \\u2014 every answer was forced, none of it was a guess. That is what a real thinker does.</p></div>' +
            '<div style="margin-top:16px"><button class="r-btn p" onclick="MP.back()">Back to the projects</button></div>';
          if (window.MindNav && MindNav.top) MindNav.top();
          return;
        }
        render();
      }
    };
    MindNav.auto();
    render();
  })();
  </script>
  <script src="../kidpad.js?v=56"></script>
</body>
</html>
