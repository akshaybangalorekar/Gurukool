<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="../icon.png" type="image/png">
<link rel="apple-touch-icon" href="../icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="../manifest.json">
<meta name="apple-mobile-web-app-title" content="Gurukool">
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Mind-Champ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
<style>
  body { padding-bottom: env(safe-area-inset-bottom); }
  .l-wrap { max-width: 840px; margin: 0 auto; padding: 26px 22px 70px; }
  .l-h1 { font-family: Baloo 2, Nunito, sans-serif; font-weight: 800; font-size: 32px; color: #0f172a; margin: 4px 0 6px; }
  .l-lead { color: #64748b; font-size: 17px; line-height: 1.6; margin: 0 0 20px; }
  .l-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
  @media (min-width: 700px) { .l-grid { grid-template-columns: repeat(2, 1fr); } }
  .l-card { display: block; text-decoration: none; background: #fff; border: 1px solid #e6ebf1; border-radius: 18px; padding: 18px; box-shadow: 0 2px 10px rgba(15,23,42,.04); }
  .l-card:hover { box-shadow: 0 10px 26px rgba(15,23,42,.09); }
  .l-card .ico { font-size: 24px; }
  .l-card b { display: block; font: 800 20px/1.2 Nunito, system-ui, sans-serif; color: #0f172a; margin-top: 6px; }
  .l-card .sub { display: block; color: #64748b; font-size: 15.5px; line-height: 1.5; margin-top: 4px; }
  .l-lv { display: inline-block; margin: 10px 6px 0 0; font: 800 13.5px Nunito, system-ui, sans-serif; border-radius: 999px; padding: 4px 11px; background: #f1f5f9; color: #475569; }
  .l-lv.l2 { background: #dbeafe; color: #1e40af; } .l-lv.l3 { background: #dcfce7; color: #166534; }
  .l-lv.strand { background: #fae8ff; color: #86198f; }
  .l-bar { display: block; height: 6px; border-radius: 999px; background: #e2e8f0; overflow: hidden; margin-top: 10px; }
  .l-bar span { display: block; height: 100%; background: #7c3aed; }
  .l-sec { font: 800 20px Nunito, system-ui, sans-serif; color: #0f172a; margin: 26px 0 10px; }
  .r-say { background: #f8fafc; border-left: 4px solid #7c3aed; border-radius: 10px; padding: 14px 16px; font-size: 18px; line-height: 1.7; color: #1f2937; }
  .r-ask { font: 800 19.5px/1.5 Nunito, system-ui, sans-serif; color: #0f172a; margin: 16px 0 10px; }
  .r-in { font: 800 20px Space Mono, ui-monospace, monospace; padding: 11px 13px; border: 2px solid #cbd5e1; border-radius: 12px; width: 170px; }
  .r-btn { font: 800 16.5px Nunito, system-ui, sans-serif; padding: 12px 18px; border-radius: 13px; border: 2px solid #cbd5e1; background: #fff; color: #334155; cursor: pointer; margin: 4px 6px 4px 0; }
  .r-btn.p { background: #7c3aed; border-color: #7c3aed; color: #fff; }
  .r-fb { font: 700 17px Nunito, system-ui, sans-serif; margin: 12px 0 0; min-height: 24px; }
  .r-fb.ok { color: #047857; } .r-fb.no { color: #b45309; }
  .r-know { background: #fffbeb; border: 1px solid #fcd34d; border-radius: 12px; padding: 12px 16px; margin: 12px 0; }
  .r-sol { background: #f5f3ff; border: 1px solid #c4b5fd; border-radius: 12px; padding: 14px 16px; margin-top: 12px; font-size: 17px; line-height: 1.7; }
  .r-dots { display: flex; gap: 6px; margin-bottom: 14px; }
  .r-dot { width: 30px; height: 6px; border-radius: 999px; background: #e2e8f0; }
  .r-dot.on { background: #7c3aed; }
</style>
</head>
<body>
  <header class="topnav" id="gk-head"></header>
  <main class="l-wrap"><div id="m-view"></div></main>
  <script src="../version.js?v=42"></script>
  <script src="../gk-fresh.js?v=42"></script>
  <script src="assets/content.js?v=42"></script>
  <script src="assets/app.js?v=42"></script>
  <script src="assets/reason.js?v=42"></script>
  <script src="../champ-rail.js?v=42"></script>
  <script src="assets/nav.js?v=42"></script>
  <script>
    MindNav.auto();
    function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
    var prog = (function(){ try { return JSON.parse(localStorage.getItem('gk_reason')||'{}'); } catch(e){ return {}; } })();
    function lvOf(k){ var p=prog[k]; if(!p) return 0; if(p.n<4) return 1; if(p.acc>=80 && p.n>=6) return 3; return p.acc>=60?2:1; }
    var reason = Reason.topics.map(function (t) {
      var lv = lvOf(t.key);
      return '<a class="l-card" href="reason.html#' + t.key + '">' +
        '<span class="ico">' + t.icon + '</span><b>' + esc(t.name) + '</b>' +
        '<span class="sub">' + esc(t.what.split('.')[0]) + '.</span>' +
        '<span class="l-lv strand">' + t.strand + ' reasoning</span>' +
        '<span class="l-lv ' + (lv===3?'l3':lv===2?'l2':'') + '">' + (lv ? 'Level ' + lv : 'Not started') + '</span>' +
        '<span class="l-bar"><span style="width:' + Math.round(100*lv/3) + '%"></span></span></a>';
    }).join('');
    var cases = MC_LEVELS.slice(0, 10).map(function (c) {
      return '<a class="l-card" href="index.html"><span class="ico">' + c.icon + '</span><b>' + esc(c.name) + '</b>' +
        '<span class="sub">' + esc(c.tech ? c.tech.name + ' \u2014 ' + c.tech.desc.split('.')[0] : 'A case to crack') + '.</span>' +
        '<span class="l-lv">' + (c.tech ? c.tech.name : 'case') + '</span></a>';
    }).join('');
    document.getElementById('m-view').innerHTML =
      '<h1 class="l-h1">Learn</h1>' +
      '<p class="l-lead">Two ladders. First the <b>reasoning ladder</b> \u2014 the exact skills that EduTest, AAS, ICAS and Olympiad papers test: analogies, odd one out, codes, number series, shape patterns and rotations. Then the <b>ten cases</b>, where each one teaches you a thinking technique.</p>' +
      '<p class="l-sec">The reasoning ladder</p><div class="l-grid">' + reason + '</div>' +
      '<p class="l-sec">The ten cases</p><div class="l-grid">' + cases + '</div>';

  </script>
</body>
</html>
